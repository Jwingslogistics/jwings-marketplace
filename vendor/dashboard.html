<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Dashboard — JWings Logistics</title>
<style>
  body { margin:0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; background:#f7f8fc; color:#1c1f2e; display:flex; align-items:center; justify-content:center; min-height:100vh; text-align:center; }
  .card { background:white; padding:48px 40px; border-radius:16px; box-shadow:0 10px 30px rgba(26,35,126,0.08); max-width:440px; }
  img { width:56px; margin-bottom:16px; }
  h1 { font-size:20px; margin:0 0 8px; color:#1a237e; }
  p { color:#666; font-size:14.5px; line-height:1.5; }
  a { color:#f57c00; font-weight:600; text-decoration:none; font-size:14px; }
</style>
</head>
<body>
  <div class="card">
    <img src="/assets/images/jwings-logo.png" alt="JWings" />
    <h1>Welcome to your vendor dashboard</h1>
    <p>You're signed in. The full vendor dashboard is being built next.</p>
    <a href="/index.html">Back to home</a>
  </div>
  <script src="/shared/supabase-client.js"></script>
  <script>
    // Basic guard: bounce back to login if there's no session at all.
    if (!window.JWingsDB.getSession()) {
      window.location.href = "/customer/login.html";
    }
  </script>
</body>
</html>
