<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>JWings Logistics Marketplace</title>
  <style>
    body {
      margin: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: #f5f6fa;
      color: #1a237e;
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      text-align: center;
    }
    .card {
      background: white;
      padding: 48px 40px;
      border-radius: 16px;
      box-shadow: 0 10px 30px rgba(26,35,126,0.08);
      max-width: 420px;
    }
    img { width: 72px; margin-bottom: 16px; }
    h1 { font-size: 22px; margin: 0 0 8px; }
    p { color: #555; font-size: 15px; line-height: 1.5; margin: 0 0 4px; }
    .tag { color: #f57c00; font-weight: 600; font-size: 13px; letter-spacing: 0.5px; text-transform: uppercase; margin-top: 16px; display: block; }
  </style>
</head>
<body>
  <div class="card">
    <img src="/assets/images/jwings-logo.png" alt="JWings Logistics" />
    <h1>JWings Logistics Marketplace</h1>
    <p>Shop. Ship. We Deliver.</p>
    <p>The full marketplace experience is under construction.</p>
    <span class="tag">Your Delivery, Our Wings.</span>
  </div>
</body>
</html>
