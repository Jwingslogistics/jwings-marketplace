  function pad(n) { return n < 10 ? "0" + n : "" + n; }
  var MONTHS = ["January","February","March","April","May","June","July","August","September","October","November","December"];
  function fmtDateTime(d) {
    var h = d.getHours(); var ampm = h >= 12 ? "PM" : "AM"; h = h % 12; if (h === 0) h = 12;

  }
  function buildSteps(currentStatus, from, to, baseTime) {
    var idx = STATUS_ORDER.indexOf(currentStatus);
    return STATUS_ORDER.map(function (key, i) {
      if (i > idx) return { key: key, timestamp: "", location: "" };
      var t = new Date(baseTime.getTime() + i * 1000 * 60 * 60 * 5);
      var location = to;
      if (key === "received" || key === "picked_up") location = from;
      if (key === "in_transit") location = "En Route to " + to;
      if (key === "out_for_delivery") location = "Out for delivery in " + to;
      return { key: key, timestamp: fmtDateTime(t), location: location };
    });
  }
  function generateTrackingId() {
    var d = new Date();
    var rand = Math.floor(Math.random() * 900 + 100);
    return "JWL-" + d.getFullYear() + pad(d.getMonth() + 1) + pad(d.getDate()) + "-" + rand;
  }
  function esc(str) {
    return String(str == null ? "" : str)
      .replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;");
  }

  function supaRequest(path, options) {

    var headers = Object.assign({

  function updateShipmentStatus(s, newStatus) {

    return supaRequest("shipments?tracking_id=eq." + encodeURIComponent(s.trackingId), {

  function renderTopBar() {
    return (
      '<div class="topbar-strip"></div>' +
      '<header class="topbar">' +
        '<div class="topbar-inner">' +
          '<button class="brand" data-action="go-track">' + brandMarkHtml(false) + '</button>' +
          '<nav class="nav">' +
            '<button class="nav-link' + (state.view === "track" ? " active" : "") + '" data-action="go-track">Track Order</button>' +
            '<span class="nav-dim">About Us</span><span class="nav-dim">Services</span><span class="nav-dim">Contact Us</span>' +
          '</nav>' +
          '<button class="admin-toggle" data-action="toggle-admin">' + (state.view === "admin" ? "Exit Admin" : "Admin") + '</button>' +
        '</div>' +
      '</header>'
    );
  }

  function renderTrackPage() {
    var html = '<section class="hero"><div class="hero-emoji">🚚</div><div class="hero-inner">';
    html += '<h1>Track Your <span>Shipment</span></h1>';
    html += '<p>Enter your Tracking ID to check the real-time status of your delivery.</p>';
    html += '<div class="search-box">';
    html += '<div class="search-input-wrap"><span>🔍</span><input id="query-input" type="text" placeholder="Enter Tracking ID (e.g. JWL-20260713-001)" value="' + esc(state.query) + '" data-bind="query" /></div>';
    html += '<button class="btn-orange" data-action="run-search"' + (state.loading ? " disabled" : "") + '>' + (state.loading ? "Tracking..." : "Track Package") + '</button>';
    html += '</div>';
    html += '<div class="secure-line">🛡️ Your information is secure and private.</div>';
    html += '</div></section>';

    html += '<section class="results">';
    if (state.error) {
      html += '<div class="error-box">' + esc(state.error) + '</div>';
    }
    if (state.shipment) {
      html += renderShipmentCard(state.shipment);
    } else if (!state.error && !state.searched) {
      html += '<div class="empty-box"><div class="big-emoji">📦</div><p>Enter a tracking ID above to see your shipment status.</p></div>';
    }
    html += '<div class="features">';
    html += featureHtml("🛡️", "Safe & Secure", "We handle your packages with utmost care.");
    html += featureHtml("⏱️", "Fast Delivery", "Timely deliveries, every time.");
    html += featureHtml("📍", "Real-time Tracking", "Track your package anytime, anywhere.");
    html += featureHtml("📞", "24/7 Support", "We're always here to help you.");
    html += '</div>';
    html += '</section>';
    return html;
  }

  function featureHtml(icon, title, desc) {
    return '<div><div class="feature-icon">' + icon + '</div><div class="feature-title">' + esc(title) + '</div><div class="feature-desc">' + esc(desc) + '</div></div>';
  }

  function renderShipmentCard(s) {
    var badge = STATUS_BADGE[s.status];
    var html = '<div class="card">';
    html += '<div class="card-head">';
    html += '<div><div class="tiny-label">Tracking ID</div><div style="display:flex;align-items:center;"><span class="track-id">' + esc(s.trackingId) + '</span><button class="icon-btn" data-action="copy-id">' + (state.copied ? "✓" : "📋") + '</button></div></div>';
    html += '<div><div class="tiny-label" style="text-align:right;">Last Updated</div><div class="updated-line">' + fmtDateTime(new Date(s.lastUpdated)) + '</div></div>';
    html += '</div>';

    html += '<div class="badge-row"><div class="badge"><div class="badge-icon">🚚</div><div><div class="badge-title">' + esc(badge.text) + '</div><div class="badge-sub">' + esc(badge.sub) + '</div></div></div></div>';

    html += '<div class="info-grid">';
    html += infoBlockHtml("📍", "From", s.from);
    html += infoBlockHtml("📍", "To", s.to);
    html += infoBlockHtml("📅", "Estimated Delivery", s.estimatedDelivery);
    html += infoBlockHtml("📦", "Service Type", s.serviceType);
    html += infoBlockHtml("💳", "Payment Status", s.paymentStatus, "#16A34A");
    html += '</div>';

    html += '<div class="body-grid">';
    html += '<div><div class="progress-title">Shipment Progress</div>';
    STATUS_ORDER.forEach(function (key, i) {
      var step = s.steps[i] || { timestamp: "", location: "" };
      var done = !!step.timestamp;
      var isCurrent = key === s.status;
      var isLast = i === STATUS_ORDER.length - 1;
      var dotBg = done ? (isCurrent ? "#F7941D" : "#16A34A") : "#E5E7EB";
      var dotContent = done ? (isCurrent ? "🚚" : "✓") : "";
      var labelColor = done ? (isCurrent ? "#E85D25" : "#111827") : "#9CA3AF";
      html += '<div class="step-row">';
      html += '<div class="step-dot-col"><div class="step-dot" style="background:' + dotBg + ';">' + dotContent + '</div>' + (!isLast ? '<div class="step-line" style="background:' + (done ? "#D1D5DB" : "#E5E7EB") + ';"></div>' : '') + '</div>';
      html += '<div class="step-content"><div><div class="step-label" style="color:' + labelColor + ';">' + STATUS_LABEL[key] + '</div><div class="step-time">' + (step.timestamp || "Pending") + '</div></div>';
      if (step.location) html += '<div class="step-loc" style="color:' + (isCurrent ? "#E85D25" : "#16A34A") + ';">' + esc(step.location) + '</div>';
      html += '</div></div>';
    });
    html += '</div>';

    html += '<div><div class="help-box"><div class="help-icon-box">📍</div><div class="help-title">Need Help?</div><div class="help-sub">Our support team is ready to assist you with your delivery.</div>';
    html += '<div class="help-btn help-btn-solid">💬 Chat on WhatsApp</div>';
    html += '<div class="help-btn help-btn-outline">📞 Call Us: 0812 345 6789</div>';
    html += '</div></div>';
    html += '</div>';
    html += '</div>';
    return html;
  }

  function infoBlockHtml(icon, label, value, color) {
    return '<div><div class="info-label">' + icon + ' ' + esc(label) + '</div><div class="info-value" style="' + (color ? "color:" + color + ";" : "") + '">' + esc(value) + '</div></div>';
  }

  function renderAdminPage() {
    if (!state.adminAuthed) {
      var html = '<div class="admin-wrap"><div class="admin-gate-card">';
      html += '<div class="lock-circle">🔒</div>';
      html += '<h2 style="font-weight:800;font-size:18px;color:#0F1E4D;margin:0 0 4px;">Admin Access</h2>';
      html += '<p style="font-size:12px;color:#6B7280;margin:0 0 20px;">Enter the staff passcode to manage shipments.</p>';
      html += '<input id="pass-input" type="password" class="admin-input" placeholder="Passcode" value="' + esc(state.pass) + '" data-bind="pass" />';
      if (state.passErr) html += '<div class="err-text">' + esc(state.passErr) + '</div>';
      html += '<button class="btn-orange" style="width:100%;margin-top:16px;" data-action="admin-login">Enter</button>';
      html += '<div class="hint-text">Demo passcode: ' + ADMIN_PASSCODE + '</div>';
      html += '</div></div>';
      return html;
    }
    return renderAdminDashboard();
  }

  function renderAdminDashboard() {
    var html = '<div class="admin-dash">';
    html += '<div class="admin-head"><div><h2 class="admin-title">Shipment Admin</h2><div class="admin-sub">Create shipments and update delivery status in real time.</div></div>';
    html += '<div style="display:flex;gap:8px;"><button class="btn-orange" data-action="toggle-new-form">+ New Shipment</button><button class="btn-outline" data-action="admin-logout">Logout</button></div></div>';

    if (state.toast) html += '<div class="toast">' + esc(state.toast) + '</div>';

    if (state.showForm) {
      html += '<div class="form-card">';
      html += fieldHtml("From", '<input id="form-from" class="admin-input" placeholder="Lagos, Nigeria" value="' + esc(state.form.from) + '" data-bind="form.from" />');
      html += fieldHtml("To", '<input id="form-to" class="admin-input" placeholder="Abuja, Nigeria" value="' + esc(state.form.to) + '" data-bind="form.to" />');
      html += fieldHtml("Estimated Delivery", '<input id="form-est" class="admin-input" placeholder="16 July 2026" value="' + esc(state.form.estimatedDelivery) + '" data-bind="form.estimatedDelivery" />');
      html += fieldHtml("Service Type", selectHtml("form-service", "form.serviceType", state.form.serviceType, ["Standard Delivery","Same Day Delivery","Next Day Delivery","Door-to-Door Delivery","Corporate Logistics"]));
      html += fieldHtml("Payment Status", selectHtml("form-payment", "form.paymentStatus", state.form.paymentStatus, ["Paid","Pending","Cash on Delivery"]));
      html += '<div class="form-actions"><button class="btn-outline" data-action="cancel-new-form">Cancel</button><button class="btn-navy" data-action="create-shipment"' + (state.saving ? " disabled" : "") + '>' + (state.saving ? "Creating..." : "Create Shipment") + '</button></div>';
      html += '</div>';
    }

    html += '<div class="list-card">';
    if (state.shipmentsLoading) {
      html += '<div class="list-empty">Loading shipments…</div>';
    } else if (state.shipments.length === 0) {
      html += '<div class="list-empty">No shipments yet. Create your first one above.</div>';
    } else {
      state.shipments.forEach(function (s) {
        var expanded = state.expandedId === s.trackingId;
        html += '<div>';
        html += '<button class="row-btn" data-action="toggle-row" data-id="' + esc(s.trackingId) + '"><div class="row-left"><div class="row-icon">📦</div><div><div class="row-id">' + esc(s.trackingId) + '</div><div class="row-route">' + esc(s.from) + ' → ' + esc(s.to) + '</div></div></div>';
        html += '<div style="display:flex;align-items:center;gap:12px;"><span class="status-pill">' + STATUS_LABEL[s.status] + '</span><span>' + (expanded ? "▾" : "▸") + '</span></div></button>';
        if (expanded) {
          html += '<div class="row-detail"><div style="font-size:12px;color:#6B7280;">Update status:</div><div class="status-btn-row">';
          STATUS_ORDER.forEach(function (key) {
            html += '<button class="status-btn' + (key === s.status ? " active" : "") + '" data-action="set-status" data-id="' + esc(s.trackingId) + '" data-status="' + key + '">' + STATUS_LABEL[key] + '</button>';
          });
          html += '</div></div>';
        }
        html += '</div>';
      });
    }
    html += '</div>';
    html += '</div>';
    return html;
  }

  function fieldHtml(label, inner) {
    return '<div><label class="field-label">' + esc(label) + '</label>' + inner + '</div>';
  }
  function selectHtml(id, bindPath, current, options) {
    var html = '<select id="' + id + '" class="admin-input" data-bind="' + bindPath + '">';
    options.forEach(function (opt) {
      html += '<option' + (opt === current ? " selected" : "") + '>' + esc(opt) + '</option>';
    });
    html += '</select>';
    return html;
  }

  function renderFooter() {
    var html = '<footer><div class="footer-grid">';
    html += '<div>' + brandMarkHtml(false) + '<div class="footer-desc">Delivering excellence across cities with speed, safety and reliability.</div></div>';
    html += footerColHtml("Quick Links", ["Track Order","About Us","Services","Contact Us"]);
    html += footerColHtml("Our Services", ["Same Day Delivery","Next Day Delivery","Door-to-Door Delivery","Corporate Logistics"]);
    html += '<div><div class="footer-col-title">Contact Us</div><div class="footer-item">📞 0812 345 6789</div><div class="footer-item">💬 support@jwingslogistics.com</div><div class="footer-item">📍 Lagos, Nigeria</div></div>';
    html += '</div>';
    html += '<div class="footer-bottom">© ' + new Date().getFullYear() + ' JWings Logistics. All Rights Reserved.</div>';
    html += '</footer>';
    return html;
  }
  function footerColHtml(title, items) {
    var html = '<div><div class="footer-col-title">' + esc(title) + '</div>';
    items.forEach(function (i) { html += '<div class="footer-item">' + esc(i) + '</div>'; });
    html += '</div>';
    return html;
  }

  function flashToast(msg) {
    state.toast = msg;
    rerender();
    setTimeout(function () { state.toast = ""; rerender(); }, 2200);
  }

  function runSearch() {
    var id = state.query.trim();
    if (!id) { state.error = "Please enter a tracking ID."; rerender(); return; }
    state.loading = true; state.error = ""; state.searched = true; rerender();
    getShipment(id).then(function (found) {
      state.loading = false;
      if (found) { state.shipment = found; }
      else { state.shipment = null; state.error = 'No shipment found for "' + id.toUpperCase() + '". Check the ID and try again.'; }
      rerender();
    }).catch(function () {
      state.loading = false; state.shipment = null;
      state.error = "Couldn't reach the database. Please try again in a moment.";
      rerender();
    });
  }

  function copyId() {
    if (!state.shipment) return;
    if (navigator.clipboard) { try { navigator.clipboard.writeText(state.shipment.trackingId); } catch (e) {} }
    state.copied = true; rerender();
    setTimeout(function () { state.copied = false; rerender(); }, 1500);
  }

  function adminLogin() {
    if (state.pass === ADMIN_PASSCODE) { state.adminAuthed = true; state.passErr = ""; loadAdminShipments(); }
    else { state.passErr = "Incorrect passcode."; }
    rerender();
  }

  function loadAdminShipments() {
    state.shipmentsLoading = true; rerender();
    listShipments().then(function (all) {
      state.shipments = all; state.shipmentsLoading = false; rerender();
    }).catch(function () {
      state.shipments = []; state.shipmentsLoading = false; rerender();
    });
  }

  function createShipment() {
    var f = state.form;
    if (!f.from.trim() || !f.to.trim() || !f.estimatedDelivery.trim()) {
      flashToast("Please fill in From, To, and Estimated Delivery."); return;
    }
    state.saving = true; rerender();
    var now = new Date().toISOString();
    var newShipment = {
      trackingId: generateTrackingId(), from: f.from.trim(), to: f.to.trim(),
      serviceType: f.serviceType, paymentStatus: f.paymentStatus,
      estimatedDelivery: f.estimatedDelivery.trim(), status: "received",
      createdAt: now, lastUpdated: now,
      steps: buildSteps("received", f.from.trim(), f.to.trim(), new Date())
    };
    insertShipment(newShipment).then(function () {
      state.form = { from: "", to: "", serviceType: "Standard Delivery", estimatedDelivery: "", paymentStatus: "Paid" };
      state.showForm = false; state.saving = false;
      flashToast("Shipment " + newShipment.trackingId + " created.");
      loadAdminShipments();
    }).catch(function (err) {
      state.saving = false;
      flashToast("Couldn't save that shipment: " + (err.message || "unknown error"));
    });
  }

  function changeStatus(trackingId, newStatus) {
    var s = state.shipments.filter(function (x) { return x.trackingId === trackingId; })[0];
    if (!s) return;
    updateShipmentStatus(s, newStatus).then(function () {
      flashToast(trackingId + ' updated to "' + STATUS_LABEL[newStatus] + '".');
      loadAdminShipments();
    }).catch(function (err) {
      flashToast("Couldn't update: " + (err.message || "unknown error"));
    });
  }

  function setBindValue(path, value) {
    var parts = path.split(".");
    if (parts.length === 1) { state[parts[0]] = value; }
    else { state[parts[0]][parts[1]] = value; }
  }

  document.body.addEventListener("click", function (e) {
    var el = e.target.closest("[data-action]");
    if (!el) return;
    var action = el.getAttribute("data-action");
    if (action === "go-track") { state.view = "track"; rerender(); }
    else if (action === "toggle-admin") { state.view = state.view === "admin" ? "track" : "admin"; rerender(); }
    else if (action === "run-search") { runSearch(); }
    else if (action === "copy-id") { copyId(); }
    else if (action === "admin-login") { adminLogin(); }
    else if (action === "admin-logout") { state.adminAuthed = false; state.pass = ""; rerender(); }
    else if (action === "toggle-new-form") { state.showForm = !state.showForm; rerender(); }
    else if (action === "cancel-new-form") { state.showForm = false; rerender(); }
    else if (action === "create-shipment") { createShipment(); }
    else if (action === "toggle-row") {
      var id = el.getAttribute("data-id");
      state.expandedId = state.expandedId === id ? null : id;
      rerender();
    } else if (action === "set-status") {
      changeStatus(el.getAttribute("data-id"), el.getAttribute("data-status"));
    }
  });

  document.body.addEventListener("input", function (e) {
    var bind = e.target.getAttribute("data-bind");
    if (!bind) return;
    setBindValue(bind, e.target.value);
    if (bind === "pass") state.passErr = "";
    rerender();
  });

  document.body.addEventListener("change", function (e) {
    var bind = e.target.getAttribute("data-bind");
    if (!bind) return;
    setBindValue(bind, e.target.value);
    rerender();
  });

  document.body.addEventListener("keydown", function (e) {
    if (e.key !== "Enter") return;
    if (e.target.id === "query-input") { runSearch(); }
    else if (e.target.id === "pass-input") { adminLogin(); }
  });

  rerender();
})();
</script>
</body>
</html>
