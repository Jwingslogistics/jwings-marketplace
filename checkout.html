<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Checkout — JWings Logistics</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:wght@500;600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root {
    --navy-900: #0f1a5c; --navy-700: #1a237e; --navy-500: #2c3a9e;
    --orange-500: #f57c00; --ink: #1c1f2e; --muted: #666a80;
    --line: #e6e8f0; --bg: #f7f8fc; --white: #ffffff; --danger: #d64545; --success: #1e9e6a;
    --font-display: "Fraunces", Georgia, serif;
    --font-body: "Inter", -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: var(--font-body); color: var(--ink); background: var(--bg); }
  a { color: inherit; text-decoration: none; }

  .nav {
    position: sticky; top: 0; z-index: 50;
    display: flex; align-items: center; justify-content: space-between;
    padding: 16px 6vw; background: rgba(247,248,252,0.92); backdrop-filter: blur(8px);
    border-bottom: 1px solid var(--line);
  }
  .nav-logo { display: flex; align-items: center; gap: 10px; }
  .nav-logo img { width: 30px; height: 30px; }
  .nav-logo span { font-weight: 700; color: var(--navy-900); font-size: 15.5px; }
  .nav-links a.link { font-size: 14px; font-weight: 500; color: var(--ink); }

  .page-head { padding: 36px 6vw 8px; }
  .page-head h1 { font-family: var(--font-display); font-size: clamp(24px, 3vw, 30px); color: var(--navy-900); font-weight: 600; }

  .checkout-layout { display: grid; grid-template-columns: 1fr 340px; gap: 28px; padding: 20px 6vw 72px; align-items: start; }
  @media (max-width: 860px) { .checkout-layout { grid-template-columns: 1fr; } }

  .panel { background: var(--white); border: 1px solid var(--line); border-radius: 14px; padding: 24px; margin-bottom: 20px; }
  .panel h3 { font-family: var(--font-display); font-size: 16.5px; color: var(--navy-900); margin-bottom: 16px; }

  .addr-card {
    display: flex; align-items: flex-start; gap: 12px; padding: 14px; border: 1.5px solid var(--line);
    border-radius: 10px; margin-bottom: 10px; cursor: pointer;
  }
  .addr-card.selected { border-color: var(--navy-500); background: #f6f7fd; }
  .addr-card input[type="radio"] { margin-top: 3px; }
  .addr-card .addr-label { font-size: 13.5px; font-weight: 700; color: var(--navy-900); }
  .addr-card .addr-text { font-size: 13px; color: var(--muted); margin-top: 2px; line-height: 1.5; }

  .add-addr-toggle { background: none; border: none; color: var(--navy-700); font-weight: 600; font-size: 13.5px; cursor: pointer; padding: 6px 0; }
  .add-addr-toggle:hover { text-decoration: underline; }

  .field { margin-bottom: 14px; }
  .field label { display: block; font-size: 13px; font-weight: 600; margin-bottom: 5px; }
  .field input { width: 100%; padding: 10px 12px; border: 1px solid var(--line); border-radius: 8px; font-size: 14px; font-family: var(--font-body); }
  .row-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }

  .delivery-option {
    display: flex; align-items: center; justify-content: space-between; gap: 12px;
    padding: 14px; border: 1.5px solid var(--line); border-radius: 10px; margin-bottom: 10px; cursor: pointer;
  }
  .delivery-option.selected { border-color: var(--navy-500); background: #f6f7fd; }
  .delivery-option .left { display: flex; align-items: center; gap: 10px; }
  .delivery-option .name { font-size: 14px; font-weight: 600; }
  .delivery-option .sub { font-size: 12px; color: var(--muted); }
  .delivery-option .price { font-size: 13.5px; font-weight: 700; color: var(--navy-900); }

  .summary-card { background: var(--white); border: 1px solid var(--line); border-radius: 14px; padding: 22px; position: sticky; top: 84px; }
  .summary-card h3 { font-family: var(--font-display); font-size: 17px; color: var(--navy-900); margin-bottom: 16px; }
  .summary-item { display: flex; justify-content: space-between; font-size: 13px; color: var(--muted); margin-bottom: 8px; }
  .summary-row { display: flex; justify-content: space-between; font-size: 13.5px; color: var(--muted); margin: 10px 0; }
  .summary-total { display: flex; justify-content: space-between; font-size: 16px; font-weight: 700; color: var(--navy-900); margin-top: 14px; padding-top: 14px; border-top: 1px solid var(--line); }

  .place-order-btn {
    width: 100%; margin-top: 18px; padding: 14px 0; background: var(--orange-500); color: var(--white);
    border: none; border-radius: 10px; font-weight: 700; font-size: 14.5px; cursor: pointer; font-family: var(--font-body);
  }
  .place-order-btn:hover { background: #e06f00; }
  .place-order-btn:disabled { background: #f3b877; cursor: not-allowed; }

  .payment-note {
    display: flex; gap: 10px; align-items: flex-start; margin-top: 16px; padding: 12px 14px;
    background: #fff4e5; border: 1px solid #ffdba3; border-radius: 10px;
  }
  .payment-note span.icon { font-size: 16px; }
  .payment-note p { font-size: 12px; color: #8a5a00; line-height: 1.5; }

  .error-banner { background: #fdecea; color: var(--danger); border: 1px solid #f5c6c2; border-radius: 10px; padding: 11px 14px; font-size: 13.5px; margin-bottom: 16px; display: none; }
  .error-banner.show { display: block; }

  .center-msg { padding: 100px 6vw; text-align: center; color: var(--muted); }

  /* ---- Success state ---- */
  .success-shell { max-width: 480px; margin: 60px auto; padding: 0 24px; text-align: center; }
  .success-icon { font-size: 52px; margin-bottom: 18px; }
  .success-shell h1 { font-family: var(--font-display); font-size: 26px; color: var(--navy-900); margin-bottom: 10px; }
  .success-shell p { color: var(--muted); font-size: 14.5px; line-height: 1.6; margin-bottom: 6px; }
  .order-number-chip {
    display: inline-block; margin: 16px 0; padding: 10px 20px; background: var(--bg);
    border: 1px solid var(--line); border-radius: 10px; font-weight: 700; color: var(--navy-900); font-size: 15px;
  }
  .success-actions { display: flex; gap: 12px; margin-top: 24px; justify-content: center; }
  .success-actions a { padding: 11px 20px; border-radius: 9px; font-size: 13.5px; font-weight: 700; }
  .btn-a { background: var(--orange-500); color: var(--white); }
  .btn-a:hover { background: #e06f00; }
  .btn-b { background: var(--white); color: var(--navy-700); border: 1px solid var(--line); }
</style>
</head>
<body>

<nav class="nav">
  <div class="nav-logo">
    <img src="/assets/images/jwings-logo.png" alt="JWings" />
    <span>JWings Logistics</span>
  </div>
  <div class="nav-links"><a class="link" href="/customer/cart.html">Back to cart</a></div>
</nav>

<div id="pageBody">
  <div class="center-msg">Loading checkout...</div>
</div>

<script src="/shared/supabase-client.js"></script>
<script>
  const session = window.JWingsDB.getSession();
  if (!session) {
    sessionStorage.setItem("jwings_redirect_after_login", window.location.href);
    window.location.href = "/customer/login.html";
  }

  // Placeholder flat delivery fees by speed. Real distance/vendor-based
  // pricing can replace this once that logic exists — kept isolated here
  // so it's a single easy swap later.
  const DELIVERY_OPTIONS = [
    { value: "standard",  label: "Standard",  sub: "2–4 business days", fee: 1500 },
    { value: "express",   label: "Express",   sub: "Next day",          fee: 3000 },
    { value: "same_day",  label: "Same day",  sub: "Delivered today",   fee: 5000 },
    { value: "pickup",    label: "Pickup",    sub: "Collect from vendor", fee: 0 },
  ];

  let cartItems = [];
  let addresses = [];
  let selectedAddressId = null;
  let selectedDelivery = "standard";
  let currency = "NGN";

  function money(amount) {
    const symbol = currency === "NGN" ? "₦" : (currency || "");
    return `${symbol}${Number(amount || 0).toLocaleString()}`;
  }

  async function init() {
    try {
      const [items, addrs] = await Promise.all([
        window.JWingsDB.select(
          "cart_items",
          `select=*,products(id,name,price,currency,stock,vendor_id)&customer_id=eq.${session.user.id}`,
          session.access_token
        ),
        window.JWingsDB.select("addresses", `select=*&user_id=eq.${session.user.id}&order=is_default.desc`, session.access_token),
      ]);

      cartItems = items.filter(i => i.products);
      addresses = addrs;

      if (cartItems.length === 0) {
        window.location.href = "/customer/cart.html";
        return;
      }

      currency = cartItems[0].products.currency;
      selectedAddressId = addresses.find(a => a.is_default) ? addresses.find(a => a.is_default).id : (addresses[0] ? addresses[0].id : null);

      render();
    } catch (err) {
      document.getElementById("pageBody").innerHTML = `<div class="center-msg">Couldn't load checkout right now. Please refresh.</div>`;
    }
  }

  function subtotal() {
    return cartItems.reduce((sum, i) => sum + i.products.price * i.quantity, 0);
  }

  function deliveryFee() {
    const opt = DELIVERY_OPTIONS.find(o => o.value === selectedDelivery);
    return opt ? opt.fee : 0;
  }

  function render() {
    const addressCards = addresses.map(a => `
      <label class="addr-card ${a.id === selectedAddressId ? "selected" : ""}" data-addr-id="${a.id}">
        <input type="radio" name="addr" value="${a.id}" ${a.id === selectedAddressId ? "checked" : ""} />
        <div>
          <div class="addr-label">${a.label || "Address"}</div>
          <div class="addr-text">${a.full_address}${a.city ? ", " + a.city : ""}${a.state ? ", " + a.state : ""}</div>
        </div>
      </label>`).join("");

    const deliveryOptionsHtml = DELIVERY_OPTIONS.map(o => `
      <label class="delivery-option ${o.value === selectedDelivery ? "selected" : ""}" data-delivery="${o.value}">
        <div class="left">
          <input type="radio" name="delivery" value="${o.value}" ${o.value === selectedDelivery ? "checked" : ""} />
          <div>
            <div class="name">${o.label}</div>
            <div class="sub">${o.sub}</div>
          </div>
        </div>
        <div class="price">${o.fee === 0 ? "Free" : money(o.fee)}</div>
      </label>`).join("");

    const itemsSummary = cartItems.map(i => `
      <div class="summary-item">
        <span>${i.products.name} × ${i.quantity}</span>
        <span>${money(i.products.price * i.quantity)}</span>
      </div>`).join("");

    const sub = subtotal();
    const fee = deliveryFee();
    const total = sub + fee;

    document.getElementById("pageBody").innerHTML = `
      <div class="page-head"><h1>Checkout</h1></div>
      <div class="checkout-layout">
        <div>
          <div class="panel">
            <h3>Delivery address</h3>
            <div class="error-banner" id="addrError"></div>
            <div id="addressList">
              ${addresses.length ? addressCards : `<p style="font-size:13.5px; color:#666a80; margin-bottom:12px;">You don't have any saved addresses yet.</p>`}
            </div>
            <button type="button" class="add-addr-toggle" id="toggleAddAddr">+ Add a new address</button>
            <form id="newAddrForm" style="display:none; margin-top:14px;">
              <div class="field"><label>Label</label><input type="text" id="newAddrLabel" placeholder="e.g. Home, Office" value="Home" /></div>
              <div class="field"><label>Full address</label><input type="text" id="newAddrFull" placeholder="Street, building, landmark" required /></div>
              <div class="row-2">
                <div class="field"><label>City</label><input type="text" id="newAddrCity" /></div>
                <div class="field"><label>State</label><input type="text" id="newAddrState" /></div>
              </div>
              <button type="submit" class="add-addr-toggle" style="color:#f57c00;">Save address</button>
            </form>
          </div>

          <div class="panel">
            <h3>Delivery speed</h3>
            ${deliveryOptionsHtml}
          </div>
        </div>

        <div class="summary-card">
          <h3>Order summary</h3>
          ${itemsSummary}
          <div class="summary-row"><span>Subtotal</span><span>${money(sub)}</span></div>
          <div class="summary-row"><span>Delivery</span><span>${fee === 0 ? "Free" : money(fee)}</span></div>
          <div class="summary-total"><span>Total</span><span>${money(total)}</span></div>
          <button class="place-order-btn" id="placeOrderBtn">Place order</button>
          <div class="payment-note">
            <span class="icon">ℹ️</span>
            <p>Card payment isn't set up yet — your order will be placed as <strong>pay on delivery</strong>. We'll email you once online payment is ready.</p>
          </div>
        </div>
      </div>`;

    wireUpForm();
  }

  function wireUpForm() {
    document.querySelectorAll(".addr-card").forEach(card => {
      card.addEventListener("click", () => {
        selectedAddressId = card.getAttribute("data-addr-id");
        render();
      });
    });
    document.querySelectorAll(".delivery-option").forEach(opt => {
      opt.addEventListener("click", () => {
        selectedDelivery = opt.getAttribute("data-delivery");
        render();
      });
    });

    const toggleBtn = document.getElementById("toggleAddAddr");
    const form = document.getElementById("newAddrForm");
    toggleBtn.addEventListener("click", () => {
      form.style.display = form.style.display === "none" ? "block" : "none";
    });

    form.addEventListener("submit", async (e) => {
      e.preventDefault();
      const fullAddress = document.getElementById("newAddrFull").value.trim();
      if (!fullAddress) return;

      try {
        const [created] = await window.JWingsDB.insert("addresses", {
          user_id: session.user.id,
          label: document.getElementById("newAddrLabel").value.trim() || "Home",
          full_address: fullAddress,
          city: document.getElementById("newAddrCity").value.trim() || null,
          state: document.getElementById("newAddrState").value.trim() || null,
          is_default: addresses.length === 0,
        }, session.access_token);

        addresses.push(created);
        selectedAddressId = created.id;
        render();
      } catch (err) {
        const errEl = document.getElementById("addrError");
        errEl.textContent = "Couldn't save that address. Please try again.";
        errEl.classList.add("show");
      }
    });

    document.getElementById("placeOrderBtn").addEventListener("click", placeOrder);
  }

  function generateOrderNumber() {
    return "JW" + Date.now().toString(36).toUpperCase() + Math.floor(Math.random() * 90 + 10);
  }

  async function placeOrder() {
    const errEl = document.getElementById("addrError");
    errEl.classList.remove("show");

    if (!selectedAddressId && selectedDelivery !== "pickup") {
      errEl.textContent = "Please select or add a delivery address.";
      errEl.classList.add("show");
      window.scrollTo({ top: 0, behavior: "smooth" });
      return;
    }

    const btn = document.getElementById("placeOrderBtn");
    btn.disabled = true;
    btn.textContent = "Placing order...";

    const sub = subtotal();
    const fee = deliveryFee();
    const total = sub + fee;

    try {
      const [order] = await window.JWingsDB.insert("orders", {
        order_number: generateOrderNumber(),
        customer_id: session.user.id,
        delivery_address_id: selectedDelivery === "pickup" ? null : selectedAddressId,
        buyer_currency: currency,
        fx_rate_to_buyer: 1, // single-currency assumption for now — see note in README/handoff
        subtotal: sub,
        delivery_fee: fee,
        service_fee: 0,
        total: total,
        delivery_type: selectedDelivery,
        status: "new",
        payment_status: "unpaid",
        payment_method: "cash_on_delivery",
      }, session.access_token);

      const orderItemsPayload = cartItems.map(i => ({
        order_id: order.id,
        vendor_id: i.products.vendor_id,
        product_id: i.products.id,
        product_name: i.products.name,
        quantity: i.quantity,
        unit_price: i.products.price,
        vendor_currency: i.products.currency,
        unit_price_buyer_currency: i.products.price,
        line_total_buyer_currency: i.products.price * i.quantity,
        variant: i.variant || null,
        vendor_order_status: "new",
      }));

      await window.JWingsDB.insert("order_items", orderItemsPayload, session.access_token);

      // Clear the cart now that the order exists.
      await window.JWingsDB.remove("cart_items", `customer_id=eq.${session.user.id}`, session.access_token);

      showSuccess(order.order_number);
    } catch (err) {
      errEl.textContent = err.message || "Couldn't place your order. Please try again.";
      errEl.classList.add("show");
      window.scrollTo({ top: 0, behavior: "smooth" });
      btn.disabled = false;
      btn.textContent = "Place order";
    }
  }

  function showSuccess(orderNumber) {
    document.getElementById("pageBody").innerHTML = `
      <div class="success-shell">
        <div class="success-icon">📦</div>
        <h1>Order placed!</h1>
        <p>Thanks — your order is in. You'll pay on delivery for now; we'll let you know as soon as online payment is ready.</p>
        <div class="order-number-chip">${orderNumber}</div>
        <p>Your vendor(s) have been notified and will start preparing your order.</p>
        <div class="success-actions">
          <a class="btn-a" href="/customer/dashboard.html">View my orders</a>
          <a class="btn-b" href="/customer/marketplace.html">Continue shopping</a>
        </div>
      </div>`;
  }

  init();
</script>
</body>
</html>
