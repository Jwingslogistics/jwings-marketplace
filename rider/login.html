<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Rider Login — JWings Logistics</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:wght@500;600&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/shared/auth.css" />
</head>
<body>
<div class="auth-shell">

  <div class="brand-panel">
    <div class="brand-logo">
      <img src="/assets/images/jwings-logo.png" alt="JWings" />
      <span>JWings Logistics</span>
    </div>
    <div class="brand-copy">
      <div class="eyebrow">JWings Riders</div>
      <h1>Ready to<br/>ride?</h1>
      <p>Log in to go online, accept delivery jobs and track your earnings.</p>
    </div>
    <div class="brand-stats">
      <div><strong>24/7</strong><span>Delivery jobs</span></div>
      <div><strong>Fast</strong><span>Wallet payouts</span></div>
    </div>
  </div>

  <div class="form-panel">
    <div class="form-card">
      <div class="mobile-logo">
        <img src="/assets/images/jwings-logo.png" alt="JWings" />
        <span>JWings Logistics</span>
      </div>

      <h2>Rider log in</h2>
      <p class="subtitle">Enter your details to access your rider account.</p>

      <div class="error-banner" id="errorBanner"></div>

      <form id="loginForm">
        <div class="field">
          <label for="identifier">Email or phone number</label>
          <input type="text" id="identifier" name="identifier" placeholder="you@example.com" required />
        </div>
        <div class="field">
          <label for="password">Password</label>
          <div style="position:relative;">
            <input type="password" id="password" name="password" placeholder="Your password" required style="padding-right:52px;" />
            <button type="button" id="togglePassword" aria-label="Show password" style="position:absolute; right:10px; top:50%; transform:translateY(-50%); background:none; border:none; cursor:pointer; font-size:12.5px; font-weight:600; color:#666a80; font-family:inherit;">Show</button>
          </div>
          <p style="text-align:right; margin-top:6px;"><a href="/rider/forgot-password.html" style="font-size:13px; font-weight:600;">Forgot password?</a></p>
        </div>

        <button type="submit" class="btn-primary" id="submitBtn">Log in</button>
      </form>

            <p class="foot-note">New rider? <a href="/rider/signup.html">Sign up to ride</a></p>
    </div>
  </div>

</div>

<script src="/shared/supabase-client.js"></script>
<script>
  
  const errorBanner = document.getElementById("errorBanner");
  const submitBtn = document.getElementById("submitBtn");

  const passwordInput = document.getElementById("password");
  const togglePasswordBtn = document.getElementById("togglePassword");
  togglePasswordBtn.addEventListener("click", () => {
    const isHidden = passwordInput.type === "password";
    passwordInput.type = isHidden ? "text" : "password";
    togglePasswordBtn.textContent = isHidden ? "Hide" : "Show";
    togglePasswordBtn.setAttribute("aria-label", isHidden ? "Hide password" : "Show password");
  });

  function showError(message) {
    errorBanner.textContent = message;
    errorBanner.classList.add("show");
  }
  function hideError() {
    errorBanner.classList.remove("show");
  }

  document.getElementById("loginForm").addEventListener("submit", async (e) => {
    e.preventDefault();
    hideError();

    const identifier = document.getElementById("identifier").value.trim();
    const password = document.getElementById("password").value;

    submitBtn.disabled = true;
    submitBtn.textContent = "Logging in...";

    try {
      const result = await window.JWingsDB.signIn(identifier, password);
      window.JWingsDB.saveSession(result);

      const profile = await window.JWingsDB.getMyProfile(result.access_token);
      if (!profile || profile.role !== "rider") {
        window.JWingsDB.clearSession();
        throw new Error("This login is for riders only. Please use the main login page.");
      }
      const params = new URLSearchParams(window.location.search);
      const redirectTo = params.get("redirect");
      window.location.href = (redirectTo && redirectTo.startsWith("/rider/")) ? redirectTo : "/rider/dashboard.html";
    } catch (err) {
      showError(err.message || "Couldn't log in. Check your details and try again.");
      submitBtn.disabled = false;
      submitBtn.textContent = "Log in";
    }
  });

</script>
</body>
</html>
