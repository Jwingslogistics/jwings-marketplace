<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Product — JWings Logistics</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:wght@500;600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root {
    --navy-900: #0f1a5c;
    --navy-700: #1a237e;
    --navy-500: #2c3a9e;
    --orange-500: #f57c00;
    --orange-400: #ff9d33;
    --ink: #1c1f2e;
    --muted: #666a80;
    --line: #e6e8f0;
    --bg: #f7f8fc;
    --white: #ffffff;
    --success: #1e9e6a;
    --danger: #d64545;
    --font-display: "Fraunces", Georgia, serif;
    --font-body: "Inter", -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: var(--font-body); color: var(--ink); background: var(--bg); }
  img { max-width: 100%; display: block; }
  a { color: inherit; text-decoration: none; }

  /* ---- Nav (same pattern as marketplace.html) ---- */
  .nav {
    position: sticky; top: 0; z-index: 50;
    display: flex; align-items: center; justify-content: space-between;
    padding: 16px 6vw;
    background: rgba(247,248,252,0.92);
    backdrop-filter: blur(8px);
    border-bottom: 1px solid var(--line);
  }
  .nav-logo { display: flex; align-items: center; gap: 10px; }
  .nav-logo img { width: 30px; height: 30px; }
  .nav-logo span { font-weight: 700; color: var(--navy-900); font-size: 15.5px; }
  .nav-links { display: flex; align-items: center; gap: 22px; }
  .nav-links a.link { font-size: 14px; font-weight: 500; color: var(--ink); }
  .nav-links a.link:hover { color: var(--navy-700); }
  .nav-cta { padding: 9px 18px; background: var(--navy-700); color: var(--white); border-radius: 8px; font-size: 13.5px; font-weight: 600; }
  .nav-cta:hover { background: var(--navy-900); }
  .cart-link { position: relative; }
  .cart-badge {
    position: absolute; top: -8px; right: -12px;
    background: var(--orange-500); color: var(--white);
    font-size: 10.5px; font-weight: 700; border-radius: 999px;
    min-width: 17px; height: 17px; display: none;
    align-items: center; justify-content: center; padding: 0 4px;
  }
  .cart-badge.show { display: flex; }

  .breadcrumb { padding: 20px 6vw 0; font-size: 13px; color: var(--muted); }
  .breadcrumb a:hover { color: var(--navy-700); }

  .product-layout {
    display: grid; grid-template-columns: 1fr 1fr; gap: 48px;
    padding: 24px 6vw 72px; align-items: start;
  }
  @media (max-width: 800px) { .product-layout { grid-template-columns: 1fr; gap: 28px; } }

  .gallery-main {
    aspect-ratio: 1; background: var(--white); border: 1px solid var(--line); border-radius: 16px;
    display: flex; align-items: center; justify-content: center; overflow: hidden; font-size: 64px; color: var(--line);
  }
  .gallery-main img { width: 100%; height: 100%; object-fit: cover; }

  .detail-vendor { font-size: 13px; color: var(--navy-700); font-weight: 600; margin-bottom: 8px; }
  .detail-vendor a:hover { text-decoration: underline; }
  .detail-name { font-family: var(--font-display); font-size: clamp(24px, 3vw, 32px); color: var(--navy-900); font-weight: 600; margin-bottom: 14px; line-height: 1.2; }
  .detail-price-row { display: flex; align-items: baseline; gap: 12px; margin-bottom: 6px; }
  .detail-price { font-family: var(--font-display); font-size: 28px; color: var(--navy-900); font-weight: 600; }
  .detail-compare { font-size: 16px; color: var(--muted); text-decoration: line-through; }
  .detail-off { font-size: 12.5px; font-weight: 700; color: var(--success); }

  .stock-pill { display: inline-block; margin: 14px 0 22px; padding: 4px 12px; border-radius: 20px; font-size: 12.5px; font-weight: 600; }
  .stock-in { background: #e9f9f1; color: var(--success); }
  .stock-low { background: #fff4e5; color: var(--orange-500); }
  .stock-out { background: #fdecea; color: var(--danger); }

  .detail-desc { color: var(--muted); font-size: 14.5px; line-height: 1.65; margin-bottom: 28px; white-space: pre-line; }

  .qty-row { display: flex; align-items: center; gap: 16px; margin-bottom: 20px; }
  .qty-stepper { display: flex; align-items: center; border: 1px solid var(--line); border-radius: 10px; overflow: hidden; }
  .qty-stepper button { width: 40px; height: 44px; border: none; background: var(--white); font-size: 17px; cursor: pointer; color: var(--navy-700); }
  .qty-stepper button:hover { background: var(--bg); }
  .qty-stepper input { width: 48px; height: 44px; border: none; border-left: 1px solid var(--line); border-right: 1px solid var(--line); text-align: center; font-size: 15px; font-family: var(--font-body); }
  .qty-note { font-size: 12.5px; color: var(--muted); }

  .add-cart-btn {
    width: 100%; padding: 15px 0; background: var(--orange-500); color: var(--white);
    border: none; border-radius: 11px; font-size: 15.5px; font-weight: 700; cursor: pointer;
    font-family: var(--font-body); transition: background 0.15s ease;
  }
  .add-cart-btn:hover { background: #e06f00; }
  .add-cart-btn:disabled { background: #f3b877; cursor: not-allowed; }

  .status-msg { margin-top: 14px; font-size: 13.5px; padding: 11px 14px; border-radius: 9px; display: none; }
  .status-msg.show { display: block; }
  .status-msg.error { background: #fdecea; color: var(--danger); border: 1px solid #f5c6c2; }
  .status-msg.success { background: #e9f9f1; color: var(--success); border: 1px solid #b9ecd4; }

  .delivery-note {
    display: flex; gap: 12px; align-items: flex-start;
    margin-top: 24px; padding: 16px; background: var(--white); border: 1px solid var(--line); border-radius: 12px;
  }
  .delivery-note .icon { font-size: 20px; }
  .delivery-note strong { display: block; font-size: 13.5px; color: var(--navy-900); margin-bottom: 3px; }
  .delivery-note span { font-size: 12.5px; color: var(--muted); }

  .center-msg { padding: 100px 6vw; text-align: center; color: var(--muted); }
  .skeleton { background: linear-gradient(90deg, var(--bg) 25%, #eef0f8 37%, var(--bg) 63%); background-size: 400% 100%; animation: shimmer 1.4s ease infinite; }
  @keyframes shimmer { 0% { background-position: 100% 0; } 100% { background-position: 0 0; } }
</style>
</head>
<body>

<nav class="nav">
  <div class="nav-logo">
    <img src="/assets/images/jwings-logo.png" alt="JWings" />
    <span>JWings Logistics</span>
  </div>
  <div class="nav-links">
    <a class="link" href="/customer/marketplace.html">Marketplace</a>
    <a class="link cart-link" href="/customer/cart.html">Cart<span class="cart-badge" id="cartBadge">0</span></a>
    <a class="link" href="/customer/dashboard.html">My orders</a>
    <a class="nav-cta" id="authCta" href="/customer/login.html">Log in</a>
  </div>
</nav>

<div class="breadcrumb">
  <a href="/customer/marketplace.html">Marketplace</a> / <span id="crumbName">Loading...</span>
</div>

<div id="pageBody">
  <div class="center-msg" id="loadingMsg">Loading product...</div>
</div>

<script src="/shared/supabase-client.js"></script>
<script>
  const params = new URLSearchParams(window.location.search);
  const productId = params.get("id");
  const session = window.JWingsDB.getSession();

  if (session) {
    document.getElementById("authCta").textContent = "My account";
    document.getElementById("authCta").href = "/customer/dashboard.html";
  }

  function money(price, currency) {
    const symbol = currency === "NGN" ? "₦" : (currency || "");
    return `${symbol}${Number(price).toLocaleString()}`;
  }

  function stockInfo(stock) {
    if (stock <= 0) return { cls: "stock-out", label: "Out of stock" };
    if (stock <= 5) return { cls: "stock-low", label: `Only ${stock} left` };
    return { cls: "stock-in", label: "In stock" };
  }

  async function refreshCartBadge() {
    if (!session) return;
    try {
      const items = await window.JWingsDB.select(
        "cart_items", `select=quantity&customer_id=eq.${session.user.id}`, session.access_token
      );
      const count = items.reduce((sum, i) => sum + i.quantity, 0);
      const badge = document.getElementById("cartBadge");
      badge.textContent = count;
      badge.classList.toggle("show", count > 0);
    } catch (err) { /* non-critical, ignore */ }
  }

  async function loadProduct() {
    if (!productId) {
      document.getElementById("pageBody").innerHTML = `<div class="center-msg">No product specified.</div>`;
      return;
    }

    try {
      const rows = await window.JWingsDB.select(
        "products",
        `select=*,vendors(id,store_name,city,state,store_slug),categories(name)&id=eq.${productId}&status=eq.active&limit=1`
      );
      const p = rows[0];

      if (!p) {
        document.getElementById("pageBody").innerHTML = `
          <div class="center-msg">
            <p style="font-size:17px; color:#1c1f2e; margin-bottom:8px;">This product isn't available anymore.</p>
            <p>It may have been removed or gone out of stock.</p>
          </div>`;
        document.getElementById("crumbName").textContent = "Not found";
        return;
      }

      document.title = `${p.name} — JWings Logistics`;
      document.getElementById("crumbName").textContent = p.name;

      const img = (p.images && p.images[0]) ? `<img src="${p.images[0]}" alt="${p.name}" />` : "📦";
      const stock = stockInfo(p.stock);
      const compare = p.compare_at_price && p.compare_at_price > p.price
        ? `<span class="detail-compare">${money(p.compare_at_price, p.currency)}</span>
           <span class="detail-off">${Math.round((1 - p.price / p.compare_at_price) * 100)}% off</span>`
        : "";

      document.getElementById("pageBody").innerHTML = `
        <div class="product-layout">
          <div class="gallery-main">${img}</div>
          <div>
            <div class="detail-vendor">
              ${p.vendors ? `by <a href="/customer/marketplace.html">${p.vendors.store_name}</a>` : "JWings Vendor"}
            </div>
            <h1 class="detail-name">${p.name}</h1>
            <div class="detail-price-row">
              <span class="detail-price">${money(p.price, p.currency)}</span>
              ${compare}
            </div>
            <span class="stock-pill ${stock.cls}">${stock.label}</span>
            <p class="detail-desc">${p.description ? p.description : "No description provided for this product yet."}</p>

            <div class="qty-row">
              <div class="qty-stepper">
                <button type="button" id="qtyMinus">−</button>
                <input type="text" id="qtyInput" value="1" inputmode="numeric" />
                <button type="button" id="qtyPlus">+</button>
              </div>
              <span class="qty-note">${p.categories ? p.categories.name : ""}</span>
            </div>

            <button class="add-cart-btn" id="addCartBtn" ${p.stock <= 0 ? "disabled" : ""}>
              ${p.stock <= 0 ? "Out of stock" : "Add to cart"}
            </button>
            <div class="status-msg" id="statusMsg"></div>

            <div class="delivery-note">
              <span class="icon">🚚</span>
              <div>
                <strong>Delivered by JWings</strong>
                <span>Every order ships with tracked delivery — no separate courier needed.</span>
              </div>
            </div>
          </div>
        </div>`;

      wireUpQuantity(p);
      wireUpAddToCart(p);
    } catch (err) {
      document.getElementById("pageBody").innerHTML = `<div class="center-msg">Couldn't load this product right now. Please refresh.</div>`;
    }
  }

  function wireUpQuantity(product) {
    const input = document.getElementById("qtyInput");
    const minus = document.getElementById("qtyMinus");
    const plus = document.getElementById("qtyPlus");
    const max = Math.max(product.stock, 1);

    function clamp() {
      let v = parseInt(input.value, 10);
      if (isNaN(v) || v < 1) v = 1;
      if (v > max) v = max;
      input.value = v;
    }
    minus.addEventListener("click", () => { input.value = Math.max(1, (parseInt(input.value, 10) || 1) - 1); });
    plus.addEventListener("click", () => { input.value = Math.min(max, (parseInt(input.value, 10) || 1) + 1); });
    input.addEventListener("input", () => { input.value = input.value.replace(/[^0-9]/g, ""); });
    input.addEventListener("blur", clamp);
  }

  function wireUpAddToCart(product) {
    const btn = document.getElementById("addCartBtn");
    const statusMsg = document.getElementById("statusMsg");

    function showStatus(msg, type) {
      statusMsg.textContent = msg;
      statusMsg.className = `status-msg show ${type}`;
    }

    btn.addEventListener("click", async () => {
      if (!session) {
        // Not logged in — send to login, then back to this product.
        sessionStorage.setItem("jwings_redirect_after_login", window.location.href);
        window.location.href = "/customer/login.html";
        return;
      }

      const qty = parseInt(document.getElementById("qtyInput").value, 10) || 1;
      btn.disabled = true;
      btn.textContent = "Adding...";

      try {
        // Look for an existing cart row for this product (no variants yet, so variant is null).
        const existing = await window.JWingsDB.select(
          "cart_items",
          `select=id,quantity&customer_id=eq.${session.user.id}&product_id=eq.${product.id}&variant=is.null&limit=1`,
          session.access_token
        );

        if (existing[0]) {
          const newQty = Math.min(existing[0].quantity + qty, product.stock);
          await window.JWingsDB.update(
            "cart_items", `id=eq.${existing[0].id}`, { quantity: newQty }, session.access_token
          );
        } else {
          await window.JWingsDB.insert("cart_items", {
            customer_id: session.user.id,
            product_id: product.id,
            quantity: qty,
          }, session.access_token);
        }

        showStatus("Added to cart.", "success");
        refreshCartBadge();
      } catch (err) {
        showStatus(err.message || "Couldn't add this to your cart. Please try again.", "error");
      } finally {
        btn.disabled = false;
        btn.textContent = product.stock <= 0 ? "Out of stock" : "Add to cart";
      }
    });
  }

  loadProduct();
  refreshCartBadge();
</script>
</body>
</html>
