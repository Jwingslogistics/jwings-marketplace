<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>My Dashboard — JWings Logistics</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:wght@500;600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root {
    --navy-900: #0f1a5c; --navy-700: #1a237e; --navy-500: #2c3a9e;
    --orange-500: #f57c00; --ink: #1c1f2e; --muted: #666a80;
    --line: #e6e8f0; --bg: #f7f8fc; --white: #ffffff; --success: #1e9e6a; --danger: #d64545;
    --font-display: "Fraunces", Georgia, serif;
    --font-body: "Inter", -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: var(--font-body); color: var(--ink); background: var(--bg); }
  a { text-decoration: none; color: inherit; }

  .nav {
    position: sticky; top: 0; z-index: 50;
    display: flex; align-items: center; justify-content: space-between;
    padding: 16px 6vw; background: rgba(247,248,252,0.92);
    backdrop-filter: blur(8px); border-bottom: 1px solid var(--line);
  }
  .nav-logo { display: flex; align-items: center; gap: 10px; }
  .nav-logo img { width: 30px; height: 30px; }
  .nav-logo span { font-weight: 700; color: var(--navy-900); font-size: 15.5px; }
  .nav-links { display: flex; align-items: center; gap: 20px; }
  .nav-links a { font-size: 14px; font-weight: 500; }
  .nav-cta { padding: 9px 18px; background: var(--navy-700); color: var(--white); border-radius: 8px; font-size: 13.5px; font-weight: 600; }
  .logout-btn { background: none; border: none; color: var(--muted); font-size: 14px; cursor: pointer; font-family: var(--font-body); }
  .logout-btn:hover { color: var(--danger); }

  .page-head { padding: 32px 6vw 8px; }
  .page-head .eyebrow { color: var(--orange-500); font-size: 12.5px; font-weight: 700; letter-spacing: 1.3px; text-transform: uppercase; margin-bottom: 8px; }
  .page-head h1 { font-family: var(--font-display); font-size: 26px; color: var(--navy-900); }

  .quick-actions { display: flex; gap: 12px; padding: 20px 6vw 8px; flex-wrap: wrap; }
  .quick-action {
    flex: 1; min-width: 160px; background: var(--white); border: 1px solid var(--line); border-radius: 14px;
    padding: 18px; display: flex; align-items: center; gap: 12px; transition: transform 0.15s ease, box-shadow 0.15s ease;
  }
  .quick-action:hover { transform: translateY(-2px); box-shadow: 0 14px 28px -18px rgba(26,35,126,0.25); }
  .quick-action .icon { font-size: 22px; }
  .quick-action .label { font-size: 13.5px; font-weight: 700; color: var(--navy-900); }

  .content { padding: 20px 6vw 72px; }
  .section-block { margin-bottom: 32px; }
  .section-head { display: flex; justify-content: space-between; align-items: center; margin-bottom: 14px; }
  .section-head h2 { font-family: var(--font-display); font-size: 19px; color: var(--navy-900); }
  .section-head a { font-size: 13px; font-weight: 600; color: var(--orange-500); }

  .list-card { background: var(--white); border: 1px solid var(--line); border-radius: 14px; overflow: hidden; }
  .row-item {
    display: flex; align-items: center; justify-content: space-between; gap: 14px;
    padding: 16px 20px; border-bottom: 1px solid var(--line); flex-wrap: wrap;
  }
  .row-item:last-child { border-bottom: none; }
  .row-item:hover { background: var(--bg); }
  .row-main { flex: 1; min-width: 180px; }
  .row-title { font-size: 14.5px; font-weight: 600; margin-bottom: 3px; }
  .row-sub { font-size: 12.5px; color: var(--muted); }
  .row-amount { font-family: var(--font-display); font-size: 15px; color: var(--navy-900); font-weight: 600; }

  .status-pill { display: inline-block; padding: 4px 11px; border-radius: 20px; font-size: 11.5px; font-weight: 700; white-space: nowrap; }
  .status-new, .status-order_received { background: #e8ecfb; color: var(--navy-700); }
  .status-accepted, .status-rider_assigned, .status-preparing, .status-picked_up { background: #fff4e5; color: var(--orange-500); }
  .status-out_for_delivery, .status-in_transit, .status-arriving_soon { background: #e6f0ff; color: #2563eb; }
  .status-completed, .status-delivered { background: #e9f9f1; color: var(--success); }
  .status-cancelled { background: #fdecea; color: var(--danger); }

  .empty-mini { text-align: center; padding: 36px 20px; }
  .empty-mini .icon { font-size: 28px; margin-bottom: 10px; }
  .empty-mini p { color: var(--muted); font-size: 13.5px; margin-bottom: 14px; }
  .empty-mini a { display: inline-block; background: var(--navy-700); color: var(--white); padding: 9px 18px; border-radius: 8px; font-size: 13px; font-weight: 600; }
  .empty-mini a:hover { background: var(--navy-900); }
</style>
</head>
<body>

<nav class="nav">
  <a class="nav-logo" href="/">
    <img src="/assets/images/jwings-logo.png" alt="JWings" />
    <span>JWings Logistics</span>
  </a>
  <div class="nav-links">
    <a href="/customer/marketplace.html">Marketplace</a>
    <a href="/customer/book-delivery.html">Book a delivery</a>
    <a href="/customer/track.html">Track order</a>
    <button class="logout-btn" id="logoutBtn">Log out</button>
  </div>
</nav>

<div class="page-head">
  <div class="eyebrow" id="greeting">Welcome back</div>
  <h1 id="nameHeading">My Dashboard</h1>
</div>

<div class="quick-actions">
  <a class="quick-action" href="/customer/marketplace.html">
    <span class="icon">🛍️</span><span class="label">Shop marketplace</span>
  </a>
  <a class="quick-action" href="/customer/book-delivery.html">
    <span class="icon">📦</span><span class="label">Book a delivery</span>
  </a>
  <a class="quick-action" href="/customer/track.html">
    <span class="icon">🔍</span><span class="label">Track an order</span>
  </a>
</div>

<div class="content">
  <div class="section-block">
    <div class="section-head">
      <h2>My Orders</h2>
      <a href="/customer/marketplace.html">Shop more →</a>
    </div>
    <div class="list-card" id="ordersCard">
      <div class="empty-mini"><p style="color:#666a80;">Loading...</p></div>
    </div>
  </div>

  <div class="section-block">
    <div class="section-head">
      <h2>My Deliveries</h2>
      <a href="/customer/book-delivery.html">Book another →</a>
    </div>
    <div class="list-card" id="shipmentsCard">
      <div class="empty-mini"><p style="color:#666a80;">Loading...</p></div>
    </div>
  </div>
</div>

<script src="/shared/supabase-client.js"></script>
<script>
  const session = window.JWingsDB.getSession();
  if (!session) window.location.href = "/customer/login.html?redirect=/customer/dashboard.html";

  function money(amount, currency) {
    const symbol = currency === "NGN" ? "₦" : (currency || "");
    return `${symbol}${Number(amount || 0).toLocaleString()}`;
  }
  function formatDate(iso) {
    const d = new Date(iso);
    return d.toLocaleDateString(undefined, { month: "short", day: "numeric", year: "numeric" });
  }
  const ORDER_LABELS = {
    new: "New", accepted: "Accepted", preparing: "Preparing", out_for_delivery: "Out for delivery",
    completed: "Completed", cancelled: "Cancelled", pending: "Pending",
  };
  const SHIPMENT_LABELS = {
    order_received: "Order received", rider_assigned: "Rider assigned", picked_up: "Picked up",
    in_transit: "In transit", arriving_soon: "Arriving soon", delivered: "Delivered", cancelled: "Cancelled",
  };

  async function loadDashboard() {
    let profile;
    try {
      profile = await window.JWingsDB.getMyProfile(session.access_token);
    } catch (err) {
      window.location.href = "/customer/login.html";
      return;
    }

    if (profile) {
      document.getElementById("greeting").textContent = `Welcome back, ${profile.full_name || "there"}`;
      document.getElementById("nameHeading").textContent = "My Dashboard";
    }

    await Promise.all([loadOrders(profile), loadShipments(profile)]);
  }

  async function loadOrders(profile) {
    const card = document.getElementById("ordersCard");
    try {
      const orders = await window.JWingsDB.select(
        "orders", `select=*&customer_id=eq.${profile.id}&order=created_at.desc&limit=10`, session.access_token
      );

      if (orders.length === 0) {
        card.innerHTML = `
          <div class="empty-mini">
            <div class="icon">🛍️</div>
            <p>You haven't placed any marketplace orders yet.</p>
            <a href="/customer/marketplace.html">Browse the marketplace</a>
          </div>`;
        return;
      }

      card.innerHTML = orders.map(o => `
        <a class="row-item" href="/customer/order-detail.html?id=${o.id}">
          <div class="row-main">
            <div class="row-title">Order ${o.order_number}</div>
            <div class="row-sub">${formatDate(o.created_at)} · ${o.delivery_type.replace("_", " ")}</div>
          </div>
          <span class="status-pill status-${o.status}">${ORDER_LABELS[o.status] || o.status}</span>
          <div class="row-amount">${money(o.total, o.buyer_currency)}</div>
        </a>`).join("");
    } catch (err) {
      card.innerHTML = `<div class="empty-mini"><p>Couldn't load your orders right now.</p></div>`;
    }
  }

  async function loadShipments(profile) {
    const card = document.getElementById("shipmentsCard");
    try {
      const shipments = await window.JWingsDB.select(
        "shipments", `select=*&sender_id=eq.${profile.id}&order=created_at.desc&limit=10`, session.access_token
      );

      if (shipments.length === 0) {
        card.innerHTML = `
          <div class="empty-mini">
            <div class="icon">📦</div>
            <p>You haven't booked any deliveries yet.</p>
            <a href="/customer/book-delivery.html">Book a delivery</a>
          </div>`;
        return;
      }

      card.innerHTML = shipments.map(s => `
        <a class="row-item" href="/customer/track.html?code=${s.tracking_id}">
          <div class="row-main">
            <div class="row-title">${s.tracking_id}</div>
            <div class="row-sub">${formatDate(s.created_at)} · to ${s.dropoff_address.slice(0, 30)}${s.dropoff_address.length > 30 ? "..." : ""}</div>
          </div>
          <span class="status-pill status-${s.status}">${SHIPMENT_LABELS[s.status] || s.status}</span>
          <div class="row-amount">${money(s.delivery_fee, s.currency)}</div>
        </a>`).join("");
    } catch (err) {
      card.innerHTML = `<div class="empty-mini"><p>Couldn't load your deliveries right now.</p></div>`;
    }
  }

  document.getElementById("logoutBtn").addEventListener("click", async () => {
    await window.JWingsDB.signOut(session.access_token);
    window.JWingsDB.clearSession();
    window.location.href = "/customer/login.html";
  });

  loadDashboard();
</script>
</body>
</html>
