<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Product — JWings Logistics</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:wght@500;600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root {
    --navy-900: #0f1a5c; --navy-700: #1a237e; --navy-500: #2c3a9e;
    --orange-500: #f57c00; --ink: #1c1f2e; --muted: #666a80;
    --line: #e6e8f0; --bg: #f7f8fc; --white: #ffffff; --success: #1e9e6a;
    --font-display: "Fraunces", Georgia, serif;
    --font-body: "Inter", -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: var(--font-body); color: var(--ink); background: var(--bg); }
  a { text-decoration: none; color: inherit; }

  .nav {
    position: sticky; top: 0; z-index: 50;
    display: flex; align-items: center; justify-content: space-between;
    padding: 16px 6vw; background: rgba(247,248,252,0.92);
    backdrop-filter: blur(8px); border-bottom: 1px solid var(--line);
  }
  .nav-logo { display: flex; align-items: center; gap: 10px; }
  .nav-logo img { width: 30px; height: 30px; }
  .nav-logo span { font-weight: 700; color: var(--navy-900); font-size: 15.5px; }
  .nav-links { display: flex; align-items: center; gap: 18px; }
  .nav-links a { font-size: 14px; font-weight: 500; }
  .cart-link { position: relative; }
  .cart-badge {
    position: absolute; top: -8px; right: -12px; background: var(--orange-500); color: white;
    font-size: 10.5px; font-weight: 700; border-radius: 10px; padding: 1px 6px; min-width: 16px; text-align: center;
  }
  .nav-cta { padding: 9px 18px; background: var(--navy-700); color: var(--white); border-radius: 8px; font-size: 13.5px; font-weight: 600; }

  .breadcrumb { padding: 20px 6vw 0; font-size: 13px; color: var(--muted); }
  .breadcrumb a:hover { color: var(--navy-700); }

  .product-layout {
    display: grid; grid-template-columns: 1fr 1fr; gap: 48px;
    padding: 24px 6vw 72px; align-items: start;
  }
  @media (max-width: 860px) { .product-layout { grid-template-columns: 1fr; } }

  .gallery-main {
    aspect-ratio: 1; background: var(--white); border: 1px solid var(--line); border-radius: 16px;
    display: flex; align-items: center; justify-content: center; overflow: hidden; font-size: 60px; color: var(--line);
  }
  .gallery-main img { width: 100%; height: 100%; object-fit: cover; }

  .info-col { position: sticky; top: 84px; }
  .vendor-tag { font-size: 12.5px; color: var(--muted); text-transform: uppercase; letter-spacing: 0.4px; margin-bottom: 8px; }
  .product-title { font-family: var(--font-display); font-size: 28px; color: var(--navy-900); margin-bottom: 12px; line-height: 1.25; }
  .price-row { display: flex; align-items: baseline; gap: 12px; margin-bottom: 6px; flex-wrap: wrap; }
  .price-now { font-family: var(--font-display); font-size: 30px; color: var(--navy-900); font-weight: 600; }
  .price-was { font-size: 16px; color: var(--muted); text-decoration: line-through; }
  .native-price-note { font-size: 12px; color: var(--muted); margin-bottom: 14px; }
  .stock-note { font-size: 13.5px; margin-bottom: 24px; }
  .stock-note.in { color: var(--success); }
  .stock-note.low { color: var(--orange-500); }
  .stock-note.out { color: #d64545; }

  .rating-row { display: flex; align-items: center; gap: 8px; margin-bottom: 10px; font-size: 13.5px; color: var(--muted); }
  .rating-stars { color: #f5a623; letter-spacing: 1px; }

  .reviews-section { max-width: 780px; margin: 0 auto; padding: 0 6vw 72px; }
  .reviews-section h2 { font-family: var(--font-display); font-size: 20px; color: var(--navy-900); margin-bottom: 18px; }
  .review-card { background: var(--white); border: 1px solid var(--line); border-radius: 12px; padding: 16px 18px; margin-bottom: 12px; }
  .review-top { display: flex; justify-content: space-between; align-items: center; margin-bottom: 6px; }
  .review-name { font-size: 13.5px; font-weight: 600; }
  .review-date { font-size: 12px; color: var(--muted); }
  .review-comment { font-size: 13.5px; color: var(--ink); line-height: 1.5; }
  .no-reviews { color: var(--muted); font-size: 14px; text-align: center; padding: 30px 0; }

  .description { color: var(--muted); font-size: 14.5px; line-height: 1.65; margin-bottom: 28px; }

  .qty-row { display: flex; align-items: center; gap: 16px; margin-bottom: 20px; }
  .qty-control { display: flex; align-items: center; border: 1px solid var(--line); border-radius: 10px; overflow: hidden; }
  .qty-control button { width: 38px; height: 38px; background: var(--white); border: none; font-size: 16px; cursor: pointer; color: var(--navy-700); }
  .qty-control button:hover { background: var(--bg); }
  .qty-control span { width: 40px; text-align: center; font-size: 14.5px; font-weight: 600; }

  .action-row { display: flex; gap: 12px; margin-bottom: 24px; }
  .btn-solid, .btn-ghost {
    flex: 1; padding: 14px 0; border-radius: 10px; font-weight: 700; font-size: 14.5px;
    border: none; cursor: pointer; font-family: var(--font-body); text-align: center;
  }
  .btn-solid { background: var(--orange-500); color: var(--white); }
  .btn-solid:hover { background: #e06f00; }
  .btn-solid:disabled { background: #f3b877; cursor: not-allowed; }
  .btn-ghost { background: var(--white); color: var(--navy-700); border: 1.5px solid var(--navy-700); }
  .btn-ghost:hover { background: var(--navy-700); color: var(--white); }

  .toast {
    position: fixed; bottom: 24px; left: 50%; transform: translateX(-50%) translateY(20px);
    background: var(--navy-900); color: var(--white); padding: 12px 22px; border-radius: 10px;
    font-size: 13.5px; font-weight: 600; opacity: 0; transition: all 0.25s ease; z-index: 200; pointer-events: none;
  }
  .toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }

  .delivery-note {
    background: var(--white); border: 1px solid var(--line); border-radius: 12px; padding: 16px;
    font-size: 13px; color: var(--muted); display: flex; gap: 10px; align-items: flex-start;
  }

  .loading-state, .error-state { padding: 80px 6vw; text-align: center; color: var(--muted); }
</style>
</head>
<body>

<nav class="nav">
  <a class="nav-logo" href="/">
    <img src="/assets/images/jwings-logo.png" alt="JWings" />
    <span>JWings Logistics</span>
  </a>
  <div class="nav-links">
    <a href="/customer/marketplace.html">Marketplace</a>
    <a class="cart-link" href="/customer/cart.html">Cart<span class="cart-badge" id="cartBadge" style="display:none;">0</span></a>
    <a class="nav-cta" href="/customer/login.html">Log in</a>
  </div>
</nav>

<div class="breadcrumb">
  <a href="/customer/marketplace.html">Marketplace</a> / <span id="crumbName">Product</span>
</div>

<div id="content">
  <div class="loading-state">Loading product...</div>
</div>

<div class="reviews-section" id="reviewsSection" style="display:none;">
  <h2>Customer Reviews</h2>
  <div id="reviewsList"></div>
</div>

<div class="toast" id="toast">Added to cart</div>

<script src="/shared/supabase-client.js"></script>
<script>
  const params = new URLSearchParams(window.location.search);
  const productId = params.get("id");

  const session = window.JWingsDB.getSession();

  function money(price, currency) {
    return window.JWingsDB.formatMoney(price, currency);
  }

  let buyerCurrency = "NGN";
  let convertedPriceValue = null; // set once we know the product + rate

  async function resolveBuyerCurrency() {
    if (!session) return "NGN";
    try {
      const profile = await window.JWingsDB.getMyProfile(session.access_token);
      return (profile && profile.currency) || "NGN";
    } catch (err) {
      return "NGN";
    }
  }

  async function updateCartBadge() {
    const badge = document.getElementById("cartBadge");
    if (!session) { badge.style.display = "none"; return; }
    try {
      const items = await window.JWingsDB.select(
        "cart_items", `select=quantity&customer_id=eq.${session.user.id}`, session.access_token
      );
      const count = items.reduce((sum, i) => sum + i.quantity, 0);
      if (count > 0) { badge.style.display = "inline-block"; badge.textContent = count; }
      else { badge.style.display = "none"; }
    } catch (err) { /* non-critical, ignore */ }
  }

  function showToast(msg) {
    const toast = document.getElementById("toast");
    toast.textContent = msg;
    toast.classList.add("show");
    setTimeout(() => toast.classList.remove("show"), 1800);
  }

  let product = null;
  let qty = 1;

  async function loadProduct() {
    if (!productId) {
      document.getElementById("content").innerHTML = `<div class="error-state">No product specified.</div>`;
      return;
    }
    try {
      const [rows, resolvedCurrency] = await Promise.all([
        window.JWingsDB.select("products", `select=*,vendors(store_name,city,state)&id=eq.${productId}&limit=1`),
        resolveBuyerCurrency(),
      ]);
      product = rows[0];
      buyerCurrency = resolvedCurrency;

      if (!product) {
        document.getElementById("content").innerHTML = `<div class="error-state">This product couldn't be found — it may have been removed.</div>`;
        return;
      }

      if (product.currency !== buyerCurrency) {
        try {
          const rate = await window.JWingsDB.getExchangeRate(product.currency, buyerCurrency, session ? session.access_token : null);
          convertedPriceValue = product.price * rate;
        } catch (err) {
          convertedPriceValue = null; // fall back to native price display
        }
      }

      render();
      loadReviews();
    } catch (err) {
      document.getElementById("content").innerHTML = `<div class="error-state">Couldn't load this product right now. Please refresh.</div>`;
    }
  }

  function starString(rating) {
    const rounded = Math.round(rating || 0);
    return "★".repeat(rounded) + "☆".repeat(5 - rounded);
  }

  async function loadReviews() {
    const section = document.getElementById("reviewsSection");
    const list = document.getElementById("reviewsList");
    try {
      const reviews = await window.JWingsDB.select(
        "reviews", `select=*,profiles(full_name)&product_id=eq.${productId}&order=created_at.desc`
      );

      section.style.display = "block";

      if (reviews.length === 0) {
        list.innerHTML = `<div class="no-reviews">No reviews yet — be the first to leave one after your order is delivered.</div>`;
        return;
      }

      list.innerHTML = reviews.map(r => `
        <div class="review-card">
          <div class="review-top">
            <span class="review-name">${r.profiles ? r.profiles.full_name : "JWings Customer"}</span>
            <span class="review-date">${new Date(r.created_at).toLocaleDateString(undefined, { month: "short", day: "numeric", year: "numeric" })}</span>
          </div>
          <div class="rating-stars" style="margin-bottom:6px;">${starString(r.rating)}</div>
          ${r.comment ? `<div class="review-comment">${r.comment}</div>` : ""}
        </div>`).join("");
    } catch (err) {
      // Silently skip — reviews are a nice-to-have, not critical to the page.
    }
  }

  function render() {
    document.getElementById("crumbName").textContent = product.name;
    document.title = `${product.name} — JWings Logistics`;

    const img = (product.images && product.images[0])
      ? `<img src="${product.images[0]}" alt="${product.name}" />` : "📦";

    const stockHtml = product.stock === 0
      ? `<div class="stock-note out">Out of stock</div>`
      : product.stock <= 5
        ? `<div class="stock-note low">Only ${product.stock} left in stock</div>`
        : `<div class="stock-note in">In stock</div>`;

    const showingNative = convertedPriceValue !== null && product.currency !== buyerCurrency;
    const shownPrice = showingNative ? convertedPriceValue : product.price;
    const shownCurrency = showingNative ? buyerCurrency : product.currency;

    const compareHtml = (product.compare_at_price && product.compare_at_price > product.price)
      ? `<span class="price-was">${money(showingNative ? product.compare_at_price * (convertedPriceValue / product.price) : product.compare_at_price, shownCurrency)}</span>` : "";

    document.getElementById("content").innerHTML = `
      <div class="product-layout">
        <div class="gallery-main">${img}</div>
        <div class="info-col">
          <div class="vendor-tag">${product.vendors ? product.vendors.store_name : "JWings Vendor"}</div>
          <h1 class="product-title">${product.name}</h1>
          <div class="price-row">
            <span class="price-now">${money(shownPrice, shownCurrency)}</span>
            ${compareHtml}
          </div>
          ${showingNative ? `<div class="native-price-note">${money(product.price, product.currency)} at the vendor's store · <a href="/customer/profile.html" style="color:var(--navy-700); font-weight:600;">change currency</a></div>` : ""}
          ${product.total_reviews > 0 ? `
            <div class="rating-row">
              <span class="rating-stars">${starString(product.rating)}</span>
              <span>${product.rating} (${product.total_reviews} review${product.total_reviews === 1 ? "" : "s"})</span>
            </div>` : `<div class="rating-row">No reviews yet</div>`}
          ${stockHtml}
          <p class="description">${product.description || "No description provided for this product yet."}</p>

          <div class="qty-row">
            <span style="font-size:13.5px; font-weight:600;">Quantity</span>
            <div class="qty-control">
              <button id="qtyMinus" type="button">−</button>
              <span id="qtyValue">1</span>
              <button id="qtyPlus" type="button">+</button>
            </div>
          </div>

          <div class="action-row">
            <button class="btn-ghost" id="addToCartBtn" ${product.stock === 0 ? "disabled" : ""}>Add to cart</button>
            <button class="btn-solid" id="buyNowBtn" ${product.stock === 0 ? "disabled" : ""}>Buy now</button>
          </div>

          <div class="delivery-note">
            <span>🚚</span>
            <span>Delivered by JWings — tracked door-to-door delivery is included and quoted at checkout.</span>
          </div>
        </div>
      </div>
    `;

    document.getElementById("qtyMinus").addEventListener("click", () => {
      if (qty > 1) { qty--; document.getElementById("qtyValue").textContent = qty; }
    });
    document.getElementById("qtyPlus").addEventListener("click", () => {
      if (qty < product.stock) { qty++; document.getElementById("qtyValue").textContent = qty; }
    });
    document.getElementById("addToCartBtn").addEventListener("click", async () => {
      const btn = document.getElementById("addToCartBtn");
      btn.disabled = true;
      try {
        await addToCart();
        showToast("Added to cart");
      } catch (err) {
        showToast(err.message || "Couldn't add to cart. Please try again.");
      } finally {
        btn.disabled = product.stock === 0;
      }
    });
    document.getElementById("buyNowBtn").addEventListener("click", async () => {
      const btn = document.getElementById("buyNowBtn");
      btn.disabled = true;
      try {
        await addToCart();
        window.location.href = "/customer/cart.html";
      } catch (err) {
        showToast(err.message || "Couldn't add to cart. Please try again.");
        btn.disabled = product.stock === 0;
      }
    });
  }

  async function addToCart() {
    if (!session) {
      sessionStorage.setItem("jwings_redirect_after_login", window.location.href);
      window.location.href = "/customer/login.html";
      return;
    }

    // No variants in the UI yet, so variant is always null — look for an
    // existing row for this exact (customer, product) pair first.
    const existing = await window.JWingsDB.select(
      "cart_items",
      `select=id,quantity&customer_id=eq.${session.user.id}&product_id=eq.${product.id}&variant=is.null&limit=1`,
      session.access_token
    );

    if (existing[0]) {
      const newQty = Math.min(existing[0].quantity + qty, product.stock);
      await window.JWingsDB.update("cart_items", `id=eq.${existing[0].id}`, { quantity: newQty }, session.access_token);
    } else {
      await window.JWingsDB.insert("cart_items", {
        customer_id: session.user.id,
        product_id: product.id,
        quantity: qty,
      }, session.access_token);
    }

    await updateCartBadge();
  }

  updateCartBadge();
  loadProduct();
</script>
</body>
</html>
