<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Forgot Password — JWings Logistics</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:wght@500;600&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/shared/auth.css" />
</head>
<body>
<div class="auth-shell">

  <div class="brand-panel">
    <div class="brand-logo">
      <img src="/assets/images/jwings-logo.png" alt="JWings" />
      <span>JWings Logistics</span>
    </div>
    <div class="brand-copy">
      <div class="eyebrow">Account recovery</div>
      <h1>Forgot your<br/>password?</h1>
      <p>No worries — enter your email and we'll send you a code to reset it.</p>
    </div>
  </div>

  <div class="form-panel">
    <div class="form-card">
      <div class="mobile-logo">
        <img src="/assets/images/jwings-logo.png" alt="JWings" />
        <span>JWings Logistics</span>
      </div>

      <h2>Reset your password</h2>
      <p class="subtitle">Enter the email address on your account and we'll send you a reset code.</p>

      <div class="error-banner" id="errorBanner"></div>
      <div class="error-banner" id="successBanner" style="background:#e6f7ef; color:#1e9e6a; border-color:#b8ebd2;"></div>

      <form id="forgotForm">
        <div class="field">
          <label for="email">Email address</label>
          <input type="email" id="email" name="email" placeholder="you@example.com" required />
        </div>

        <button type="submit" class="btn-primary" id="submitBtn">Send reset code</button>
      </form>

      <p class="foot-note">Remembered your password? <a href="/customer/login.html">Log in</a></p>
    </div>
  </div>

</div>

<script src="/shared/supabase-client.js"></script>
<script>
  const errorBanner = document.getElementById("errorBanner");
  const successBanner = document.getElementById("successBanner");
  const submitBtn = document.getElementById("submitBtn");

  function showError(message) {
    successBanner.classList.remove("show");
    errorBanner.textContent = message;
    errorBanner.classList.add("show");
  }
  function showSuccess(message) {
    errorBanner.classList.remove("show");
    successBanner.textContent = message;
    successBanner.classList.add("show");
  }

  document.getElementById("forgotForm").addEventListener("submit", async (e) => {
    e.preventDefault();
    errorBanner.classList.remove("show");
    successBanner.classList.remove("show");

    const email = document.getElementById("email").value.trim();
    submitBtn.disabled = true;
    submitBtn.textContent = "Sending...";

    try {
      await window.JWingsDB.recoverPassword(email);
      showSuccess("If an account exists for that email, a reset code is on its way.");
      submitBtn.textContent = "Code sent";
      setTimeout(() => {
        window.location.href = `/customer/reset-password.html?email=${encodeURIComponent(email)}`;
      }, 1500);
    } catch (err) {
      showError(err.message || "Couldn't send a reset code. Please try again.");
      submitBtn.disabled = false;
      submitBtn.textContent = "Send reset code";
    }
  });
</script>
</body>
</html>
