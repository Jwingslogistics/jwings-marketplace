<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Reset Password — JWings Logistics</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:wght@500;600&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/shared/auth.css" />
</head>
<body>
<div class="auth-shell">

  <div class="brand-panel">
    <div class="brand-logo">
      <img src="/assets/images/jwings-logo.png" alt="JWings" />
      <span>JWings Logistics</span>
    </div>
    <div class="brand-copy">
      <div class="eyebrow">Account recovery</div>
      <h1>Enter your<br/>reset code.</h1>
      <p>Check your email for the 6-digit code we just sent, and choose a new password.</p>
    </div>
  </div>

  <div class="form-panel">
    <div class="form-card">
      <div class="mobile-logo">
        <img src="/assets/images/jwings-logo.png" alt="JWings" />
        <span>JWings Logistics</span>
      </div>

      <h2>Reset your password</h2>
      <p class="subtitle">Enter the code from your email and choose a new password.</p>

      <div class="error-banner" id="errorBanner"></div>

      <form id="resetForm">
        <div class="field">
          <label for="email">Email address</label>
          <input type="email" id="email" name="email" placeholder="you@example.com" required />
        </div>
        <div class="field">
          <label for="code">Reset code</label>
          <input type="text" id="code" name="code" placeholder="6-digit code" inputmode="numeric" required />
        </div>
        <div class="field">
          <label for="newPassword">New password</label>
          <input type="password" id="newPassword" name="newPassword" placeholder="At least 6 characters" minlength="6" required />
        </div>
        <div class="field">
          <label for="confirmPassword">Confirm new password</label>
          <input type="password" id="confirmPassword" name="confirmPassword" placeholder="Re-enter your new password" minlength="6" required />
        </div>

        <button type="submit" class="btn-primary" id="submitBtn">Reset password</button>
      </form>

      <p class="foot-note">Didn't get a code? <a href="/customer/forgot-password.html">Request a new one</a></p>
    </div>
  </div>

</div>

<script src="/shared/supabase-client.js"></script>
<script>
  // Pre-fill the email if it was passed from forgot-password.html.
  const params = new URLSearchParams(window.location.search);
  const prefillEmail = params.get("email");
  if (prefillEmail) document.getElementById("email").value = prefillEmail;

  const errorBanner = document.getElementById("errorBanner");
  const submitBtn = document.getElementById("submitBtn");

  function showError(message) {
    errorBanner.textContent = message;
    errorBanner.classList.add("show");
  }

  document.getElementById("resetForm").addEventListener("submit", async (e) => {
    e.preventDefault();
    errorBanner.classList.remove("show");

    const email = document.getElementById("email").value.trim();
    const code = document.getElementById("code").value.trim();
    const newPassword = document.getElementById("newPassword").value;
    const confirmPassword = document.getElementById("confirmPassword").value;

    if (newPassword.length < 6) {
      showError("Password must be at least 6 characters.");
      return;
    }
    if (newPassword !== confirmPassword) {
      showError("Passwords don't match.");
      return;
    }

    submitBtn.disabled = true;
    submitBtn.textContent = "Resetting...";

    try {
      // Verifying the recovery code logs the user in with a fresh session.
      const result = await window.JWingsDB.verifyOtp(email, code, "recovery");
      const session = result.session || result; // verify endpoint returns session fields directly

      await window.JWingsDB.updatePassword(newPassword, session.access_token);
      window.JWingsDB.saveSession(session);

      const profile = await window.JWingsDB.getMyProfile(session.access_token);
      window.JWingsDB.redirectForRole(profile ? profile.role : "customer");
    } catch (err) {
      showError(err.message || "That code is invalid or has expired. Please request a new one.");
      submitBtn.disabled = false;
      submitBtn.textContent = "Reset password";
    }
  });
</script>
</body>
</html>
