<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Your Cart — JWings Logistics</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:wght@500;600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root {
    --navy-900: #0f1a5c; --navy-700: #1a237e; --navy-500: #2c3a9e;
    --orange-500: #f57c00; --ink: #1c1f2e; --muted: #666a80;
    --line: #e6e8f0; --bg: #f7f8fc; --white: #ffffff;
    --font-display: "Fraunces", Georgia, serif;
    --font-body: "Inter", -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: var(--font-body); color: var(--ink); background: var(--bg); }
  a { text-decoration: none; color: inherit; }

  .nav {
    position: sticky; top: 0; z-index: 50;
    display: flex; align-items: center; justify-content: space-between;
    padding: 16px 6vw; background: rgba(247,248,252,0.92);
    backdrop-filter: blur(8px); border-bottom: 1px solid var(--line);
  }
  .nav-logo { display: flex; align-items: center; gap: 10px; }
  .nav-logo img { width: 30px; height: 30px; }
  .nav-logo span { font-weight: 700; color: var(--navy-900); font-size: 15.5px; }
  .nav-links a { font-size: 14px; font-weight: 500; }

  .page-head { padding: 32px 6vw 8px; }
  .page-head h1 { font-family: var(--font-display); font-size: 26px; color: var(--navy-900); }
  .currency-note { font-size: 12.5px; color: var(--muted); margin-top: 4px; }
  .currency-note a { color: var(--navy-700); font-weight: 600; text-decoration: underline; }

  .cart-layout { display: grid; grid-template-columns: 1fr 340px; gap: 28px; padding: 20px 6vw 72px; align-items: start; }
  @media (max-width: 860px) { .cart-layout { grid-template-columns: 1fr; } }

  .cart-item {
    display: flex; gap: 16px; background: var(--white); border: 1px solid var(--line);
    border-radius: 14px; padding: 16px; margin-bottom: 14px; align-items: center; flex-wrap: wrap;
  }
  .item-thumb {
    width: 72px; height: 72px; border-radius: 10px; background: var(--bg); flex-shrink: 0;
    display: flex; align-items: center; justify-content: center; font-size: 26px; overflow: hidden;
  }
  .item-thumb img { width: 100%; height: 100%; object-fit: cover; }
  .item-info { flex: 1; min-width: 0; }
  .item-vendor { font-size: 11.5px; color: var(--muted); text-transform: uppercase; margin-bottom: 3px; }
  .item-name { font-size: 15px; font-weight: 600; margin-bottom: 4px; }
  .item-price { font-size: 13.5px; color: var(--muted); }
  .item-controls { display: flex; align-items: center; gap: 14px; }
  .qty-control { display: flex; align-items: center; border: 1px solid var(--line); border-radius: 8px; overflow: hidden; }
  .qty-control button { width: 30px; height: 30px; background: var(--white); border: none; font-size: 14px; cursor: pointer; color: var(--navy-700); }
  .qty-control button:hover { background: var(--bg); }
  .qty-control span { width: 30px; text-align: center; font-size: 13.5px; font-weight: 600; }
  .remove-btn { background: none; border: none; color: #d64545; font-size: 12.5px; font-weight: 600; cursor: pointer; font-family: var(--font-body); }
  .item-total { font-family: var(--font-display); font-size: 15.5px; color: var(--navy-900); font-weight: 600; min-width: 80px; text-align: right; }

  .summary-panel { background: var(--white); border: 1px solid var(--line); border-radius: 16px; padding: 24px; position: sticky; top: 84px; }
  .summary-panel h3 { font-family: var(--font-display); font-size: 17px; color: var(--navy-900); margin-bottom: 18px; }
  .summary-row { display: flex; justify-content: space-between; font-size: 14px; margin-bottom: 12px; color: var(--muted); }
  .summary-row.total { border-top: 1px solid var(--line); padding-top: 14px; margin-top: 6px; font-size: 16px; font-weight: 700; color: var(--navy-900); }
  .summary-note { font-size: 12px; color: var(--muted); margin-top: 4px; margin-bottom: 16px; }
  .checkout-btn {
    width: 100%; padding: 14px 0; background: var(--orange-500); color: var(--white); border: none;
    border-radius: 10px; font-weight: 700; font-size: 15px; cursor: pointer; font-family: var(--font-body);
  }
  .checkout-btn:hover { background: #e06f00; }
  .checkout-btn:disabled { background: #f3b877; cursor: not-allowed; }

  .empty-cart { grid-column: 1 / -1; text-align: center; padding: 80px 20px; background: var(--white); border: 1px dashed var(--line); border-radius: 16px; }
  .empty-cart .icon { font-size: 40px; margin-bottom: 16px; }
  .empty-cart h3 { font-family: var(--font-display); font-size: 20px; color: var(--navy-900); margin-bottom: 8px; }
  .empty-cart p { color: var(--muted); font-size: 14.5px; margin-bottom: 20px; }
  .empty-cart a { display: inline-block; background: var(--orange-500); color: var(--white); padding: 11px 22px; border-radius: 9px; font-weight: 700; font-size: 14px; }
</style>
</head>
<body>

<nav class="nav">
  <a class="nav-logo" href="/">
    <img src="/assets/images/jwings-logo.png" alt="JWings" />
    <span>JWings Logistics</span>
  </a>
  <div class="nav-links">
    <a href="/customer/marketplace.html">Continue shopping</a>
  </div>
</nav>

<div class="page-head">
  <h1>Your Cart</h1>
  <div class="currency-note" id="currencyNote"></div>
</div>

<div class="cart-layout" id="cartLayout">
  <div id="itemsList"></div>
  <div class="summary-panel" id="summaryPanel" style="display:none;">
    <h3>Order Summary</h3>
    <div class="summary-row"><span>Subtotal</span><span id="sumSubtotal">₦0</span></div>
    <div class="summary-note">Delivery and service fees are calculated at checkout.</div>
    <button class="checkout-btn" id="checkoutBtn">Proceed to checkout</button>
  </div>
</div>

<script src="/shared/supabase-client.js"></script>
<script>
  const session = window.JWingsDB.getSession();
  if (!session) {
    sessionStorage.setItem("jwings_redirect_after_login", window.location.href);
    window.location.href = "/customer/login.html";
  }

  function money(amount, currency) {
    return window.JWingsDB.formatMoney(amount, currency);
  }

  let cartRows = []; // raw cart_items rows with embedded product+vendor
  let buyerCurrency = "NGN";
  const rateCache = {};

  // Buyer-currency price for one cart row's product.
  function convertedUnitPrice(row) {
    const p = row.products;
    if (p.currency === buyerCurrency) return p.price;
    const rate = rateCache[`${p.currency}_${buyerCurrency}`];
    return rate ? p.price * rate : p.price;
  }

  async function loadCart() {
    try {
      const profile = await window.JWingsDB.getMyProfile(session.access_token);
      buyerCurrency = (profile && profile.currency) || "NGN";
      if (buyerCurrency !== "NGN") {
        document.getElementById("currencyNote").innerHTML =
          `Prices shown converted to ${buyerCurrency}. <a href="/customer/profile.html">Change currency</a>`;
      }

      const items = await window.JWingsDB.select(
        "cart_items",
        `select=*,products(id,name,price,currency,stock,images,vendor_id,vendors(store_name))&customer_id=eq.${session.user.id}&order=created_at.desc`,
        session.access_token
      );
      cartRows = items.filter(i => i.products); // drop rows whose product was deleted

      // Pre-fetch any rates we need for the currencies present in the cart.
      const uniqueCurrencies = [...new Set(cartRows.map(r => r.products.currency).filter(c => c && c !== buyerCurrency))];
      await Promise.all(uniqueCurrencies.map(async (c) => {
        try {
          rateCache[`${c}_${buyerCurrency}`] = await window.JWingsDB.getExchangeRate(c, buyerCurrency, session.access_token);
        } catch (err) { /* falls back to native price below */ }
      }));

      render();
    } catch (err) {
      document.getElementById("itemsList").innerHTML = `<div class="empty-cart"><h3>Couldn't load your cart</h3><p>Please refresh the page.</p></div>`;
      document.getElementById("summaryPanel").style.display = "none";
    }
  }

  function render() {
    const itemsList = document.getElementById("itemsList");
    const summaryPanel = document.getElementById("summaryPanel");

    if (cartRows.length === 0) {
      itemsList.innerHTML = `
        <div class="empty-cart">
          <div class="icon">🛒</div>
          <h3>Your cart is empty</h3>
          <p>Browse the marketplace to find something you'll love.</p>
          <a href="/customer/marketplace.html">Start shopping</a>
        </div>`;
      summaryPanel.style.display = "none";
      return;
    }

    summaryPanel.style.display = "block";

    itemsList.innerHTML = cartRows.map((row) => {
      const p = row.products;
      const thumb = (p.images && p.images[0]) ? `<img src="${p.images[0]}" alt="${p.name}" />` : "📦";
      const unitPrice = convertedUnitPrice(row);
      const showingNative = p.currency !== buyerCurrency;
      return `
        <div class="cart-item">
          <div class="item-thumb">${thumb}</div>
          <div class="item-info">
            <div class="item-vendor">${p.vendors ? p.vendors.store_name : "JWings Vendor"}</div>
            <div class="item-name">${p.name}</div>
            <div class="item-price">${money(unitPrice, buyerCurrency)} each${showingNative ? ` (${money(p.price, p.currency)} at store)` : ""}</div>
          </div>
          <div class="item-controls">
            <div class="qty-control">
              <button data-id="${row.id}" data-stock="${p.stock}" data-action="minus" type="button">−</button>
              <span>${row.quantity}</span>
              <button data-id="${row.id}" data-stock="${p.stock}" data-action="plus" type="button">+</button>
            </div>
            <button class="remove-btn" data-id="${row.id}" data-action="remove" type="button">Remove</button>
          </div>
          <div class="item-total">${money(unitPrice * row.quantity, buyerCurrency)}</div>
        </div>`;
    }).join("");

    const subtotal = cartRows.reduce((sum, row) => sum + convertedUnitPrice(row) * row.quantity, 0);
    document.getElementById("sumSubtotal").textContent = money(subtotal, buyerCurrency);

    itemsList.querySelectorAll("[data-action]").forEach((btn) => {
      btn.addEventListener("click", async () => {
        const id = btn.getAttribute("data-id");
        const action = btn.getAttribute("data-action");
        const stock = parseInt(btn.getAttribute("data-stock") || "0", 10);
        const row = cartRows.find(r => r.id === id);
        if (!row) return;

        try {
          if (action === "remove") {
            await window.JWingsDB.remove("cart_items", `id=eq.${id}`, session.access_token);
          } else {
            let newQty = row.quantity + (action === "plus" ? 1 : -1);
            if (newQty > stock) newQty = stock;
            if (newQty <= 0) {
              await window.JWingsDB.remove("cart_items", `id=eq.${id}`, session.access_token);
            } else {
              await window.JWingsDB.update("cart_items", `id=eq.${id}`, { quantity: newQty }, session.access_token);
            }
          }
          await loadCart();
        } catch (err) { /* leave UI as-is on failure */ }
      });
    });
  }

  document.getElementById("checkoutBtn").addEventListener("click", () => {
    window.location.href = "/customer/checkout.html";
  });

  loadCart();
</script>
</body>
</html>
