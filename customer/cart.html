<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Your Cart — JWings Logistics</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:wght@500;600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root {
    --navy-900: #0f1a5c; --navy-700: #1a237e; --navy-500: #2c3a9e;
    --orange-500: #f57c00; --ink: #1c1f2e; --muted: #666a80;
    --line: #e6e8f0; --bg: #f7f8fc; --white: #ffffff;
    --font-display: "Fraunces", Georgia, serif;
    --font-body: "Inter", -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: var(--font-body); color: var(--ink); background: var(--bg); }
  a { text-decoration: none; color: inherit; }

  .nav {
    position: sticky; top: 0; z-index: 50;
    display: flex; align-items: center; justify-content: space-between;
    padding: 16px 6vw; background: rgba(247,248,252,0.92);
    backdrop-filter: blur(8px); border-bottom: 1px solid var(--line);
  }
  .nav-logo { display: flex; align-items: center; gap: 10px; }
  .nav-logo img { width: 30px; height: 30px; }
  .nav-logo span { font-weight: 700; color: var(--navy-900); font-size: 15.5px; }
  .nav-links a { font-size: 14px; font-weight: 500; }

  .page-head { padding: 32px 6vw 8px; }
  .page-head h1 { font-family: var(--font-display); font-size: 26px; color: var(--navy-900); }

  .cart-layout { display: grid; grid-template-columns: 1fr 340px; gap: 28px; padding: 20px 6vw 72px; align-items: start; }
  @media (max-width: 860px) { .cart-layout { grid-template-columns: 1fr; } }

  .cart-item {
    display: flex; gap: 16px; background: var(--white); border: 1px solid var(--line);
    border-radius: 14px; padding: 16px; margin-bottom: 14px; align-items: center;
  }
  .item-thumb {
    width: 72px; height: 72px; border-radius: 10px; background: var(--bg); flex-shrink: 0;
    display: flex; align-items: center; justify-content: center; font-size: 26px; overflow: hidden;
  }
  .item-thumb img { width: 100%; height: 100%; object-fit: cover; }
  .item-info { flex: 1; min-width: 0; }
  .item-vendor { font-size: 11.5px; color: var(--muted); text-transform: uppercase; margin-bottom: 3px; }
  .item-name { font-size: 15px; font-weight: 600; margin-bottom: 4px; }
  .item-price { font-size: 13.5px; color: var(--muted); }
  .item-controls { display: flex; align-items: center; gap: 14px; }
  .qty-control { display: flex; align-items: center; border: 1px solid var(--line); border-radius: 8px; overflow: hidden; }
  .qty-control button { width: 30px; height: 30px; background: var(--white); border: none; font-size: 14px; cursor: pointer; color: var(--navy-700); }
  .qty-control button:hover { background: var(--bg); }
  .qty-control span { width: 30px; text-align: center; font-size: 13.5px; font-weight: 600; }
  .remove-btn { background: none; border: none; color: #d64545; font-size: 12.5px; font-weight: 600; cursor: pointer; font-family: var(--font-body); }
  .item-total { font-family: var(--font-display); font-size: 15.5px; color: var(--navy-900); font-weight: 600; min-width: 80px; text-align: right; }

  .summary-panel { background: var(--white); border: 1px solid var(--line); border-radius: 16px; padding: 24px; position: sticky; top: 84px; }
  .summary-panel h3 { font-family: var(--font-display); font-size: 17px; color: var(--navy-900); margin-bottom: 18px; }
  .summary-row { display: flex; justify-content: space-between; font-size: 14px; margin-bottom: 12px; color: var(--muted); }
  .summary-row.total { border-top: 1px solid var(--line); padding-top: 14px; margin-top: 6px; font-size: 16px; font-weight: 700; color: var(--navy-900); }
  .summary-note { font-size: 12px; color: var(--muted); margin-top: 4px; margin-bottom: 16px; }
  .checkout-btn {
    width: 100%; padding: 14px 0; background: var(--orange-500); color: var(--white); border: none;
    border-radius: 10px; font-weight: 700; font-size: 15px; cursor: pointer; font-family: var(--font-body);
  }
  .checkout-btn:hover { background: #e06f00; }
  .checkout-btn:disabled { background: #f3b877; cursor: not-allowed; }

  .empty-cart { grid-column: 1 / -1; text-align: center; padding: 80px 20px; background: var(--white); border: 1px dashed var(--line); border-radius: 16px; }
  .empty-cart .icon { font-size: 40px; margin-bottom: 16px; }
  .empty-cart h3 { font-family: var(--font-display); font-size: 20px; color: var(--navy-900); margin-bottom: 8px; }
  .empty-cart p { color: var(--muted); font-size: 14.5px; margin-bottom: 20px; }
  .empty-cart a { display: inline-block; background: var(--orange-500); color: var(--white); padding: 11px 22px; border-radius: 9px; font-weight: 700; font-size: 14px; }
</style>
</head>
<body>

<nav class="nav">
  <a class="nav-logo" href="/">
    <img src="/assets/images/jwings-logo.png" alt="JWings" />
    <span>JWings Logistics</span>
  </a>
  <div class="nav-links">
    <a href="/customer/marketplace.html">Continue shopping</a>
  </div>
</nav>

<div class="page-head">
  <h1>Your Cart</h1>
</div>

<div class="cart-layout" id="cartLayout">
  <div id="itemsList"></div>
  <div class="summary-panel" id="summaryPanel" style="display:none;">
    <h3>Order Summary</h3>
    <div class="summary-row"><span>Subtotal</span><span id="sumSubtotal">₦0</span></div>
    <div class="summary-note">Delivery and service fees are calculated at checkout.</div>
    <button class="checkout-btn" id="checkoutBtn">Proceed to checkout</button>
  </div>
</div>

<script src="/shared/supabase-client.js"></script>
<script>
  function getCart() {
    try { return JSON.parse(localStorage.getItem("jwings_cart") || "[]"); }
    catch { return []; }
  }
  function saveCart(cart) {
    localStorage.setItem("jwings_cart", JSON.stringify(cart));
  }
  function money(amount, currency) {
    const symbol = currency === "NGN" ? "₦" : (currency || "");
    return `${symbol}${Number(amount).toLocaleString()}`;
  }

  function render() {
    const cart = getCart();
    const itemsList = document.getElementById("itemsList");
    const summaryPanel = document.getElementById("summaryPanel");

    if (cart.length === 0) {
      itemsList.innerHTML = `
        <div class="empty-cart">
          <div class="icon">🛒</div>
          <h3>Your cart is empty</h3>
          <p>Browse the marketplace to find something you'll love.</p>
          <a href="/customer/marketplace.html">Start shopping</a>
        </div>`;
      summaryPanel.style.display = "none";
      return;
    }

    summaryPanel.style.display = "block";

    itemsList.innerHTML = cart.map((item, idx) => {
      const thumb = item.image ? `<img src="${item.image}" alt="${item.name}" />` : "📦";
      return `
        <div class="cart-item">
          <div class="item-thumb">${thumb}</div>
          <div class="item-info">
            <div class="item-vendor">${item.vendor_name}</div>
            <div class="item-name">${item.name}</div>
            <div class="item-price">${money(item.price, item.currency)} each</div>
          </div>
          <div class="item-controls">
            <div class="qty-control">
              <button data-idx="${idx}" data-action="minus" type="button">−</button>
              <span>${item.quantity}</span>
              <button data-idx="${idx}" data-action="plus" type="button">+</button>
            </div>
            <button class="remove-btn" data-idx="${idx}" data-action="remove" type="button">Remove</button>
          </div>
          <div class="item-total">${money(item.price * item.quantity, item.currency)}</div>
        </div>`;
    }).join("");

    const subtotal = cart.reduce((sum, i) => sum + i.price * i.quantity, 0);
    const currency = cart[0].currency;
    document.getElementById("sumSubtotal").textContent = money(subtotal, currency);

    itemsList.querySelectorAll("[data-action]").forEach((btn) => {
      btn.addEventListener("click", () => {
        const idx = parseInt(btn.getAttribute("data-idx"), 10);
        const action = btn.getAttribute("data-action");
        const cart = getCart();
        if (action === "plus" && cart[idx].quantity < cart[idx].stock) cart[idx].quantity++;
        if (action === "minus") { cart[idx].quantity--; if (cart[idx].quantity <= 0) cart.splice(idx, 1); }
        if (action === "remove") cart.splice(idx, 1);
        saveCart(cart);
        render();
      });
    });
  }

  document.getElementById("checkoutBtn").addEventListener("click", () => {
    const session = window.JWingsDB.getSession();
    if (!session) {
      window.location.href = "/customer/login.html";
      return;
    }
    window.location.href = "/customer/checkout.html";
  });

  render();
</script>
</body>
</html>
