<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Pay — JWings Logistics</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:wght@500;600&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root { --navy-900:#0f1a5c; --navy-700:#1a237e; --orange-500:#f57c00; --muted:#666a80; --line:#e6e8f0; --bg:#f7f8fc; }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: "Inter", sans-serif; background: var(--bg); color: #1c1f2e; min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 24px; }
  .card { background: #fff; border: 1px solid var(--line); border-radius: 18px; padding: 40px 32px; max-width: 440px; width: 100%; text-align: center; }
  .icon { font-size: 44px; margin-bottom: 14px; }
  h1 { font-family: "Fraunces", Georgia, serif; font-size: 24px; color: var(--navy-900); margin-bottom: 10px; }
  p { color: var(--muted); font-size: 14.5px; line-height: 1.6; margin-bottom: 22px; }
  a.btn { display: inline-block; background: var(--navy-700); color: #fff; padding: 12px 22px; border-radius: 10px; font-weight: 700; font-size: 14px; text-decoration: none; margin: 4px; }
  a.btn.ghost { background: transparent; color: var(--navy-700); border: 1.5px solid var(--navy-700); }
</style>
</head>
<body>
<div class="card" id="card">
  <div class="icon">⏳</div>
  <h1>Taking you to payment...</h1>
  <p>Please wait a moment.</p>
</div>

<script src="/shared/supabase-client.js"></script>
<script>
  const session = window.JWingsDB.getSession();
  const params = new URLSearchParams(window.location.search);
  const orderId = params.get("order");
  const shipmentId = params.get("shipment");
  const card = document.getElementById("card");

  function fail(msg) {
    card.innerHTML = `<div class="icon">⚠️</div><h1>Couldn't start the payment</h1><p>${msg}</p><a class="btn" href="/customer/dashboard.html">My dashboard</a>`;
  }

  async function start() {
    try {
      const res = await fetch("https://jalswkctkuidzucocrmh.supabase.co/functions/v1/paystack-initialize", {
        method: "POST",
        headers: {
          "Content-Type": "application/json",
          "Authorization": `Bearer ${session.access_token}`,
          "apikey": "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImphbHN3a2N0a3VpZHp1Y29jcm1oIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODU1MDEwNzIsImV4cCI6MjEwMTA3NzA3Mn0.e1Tw7e5oN9B3r0953k0d_5U8kX1hddJhAXRRfVi9C9g",
        },
        body: JSON.stringify(orderId ? { order_id: orderId } : { shipment_id: shipmentId }),
      });
      const data = await res.json().catch(() => ({}));
      if (res.ok && data.authorization_url) { window.location.href = data.authorization_url; return; }
      fail(data.error || "Please try again in a moment.");
    } catch (e) {
      fail("Please check your connection and try again.");
    }
  }

  if (!session) {
    window.location.href = "/customer/login.html?redirect=" + encodeURIComponent(window.location.pathname + window.location.search);
  } else if (!orderId && !shipmentId) {
    fail("There is nothing to pay for here.");
  } else {
    start();
  }
</script>
</body>
</html>
