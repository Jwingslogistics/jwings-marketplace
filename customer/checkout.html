<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Checkout — JWings Logistics</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:wght@500;600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root {
    --navy-900: #0f1a5c; --navy-700: #1a237e; --navy-500: #2c3a9e;
    --orange-500: #f57c00; --ink: #1c1f2e; --muted: #666a80;
    --line: #e6e8f0; --bg: #f7f8fc; --white: #ffffff; --danger: #d64545;
    --font-display: "Fraunces", Georgia, serif;
    --font-body: "Inter", -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: var(--font-body); color: var(--ink); background: var(--bg); }
  a { text-decoration: none; color: inherit; }

  .nav {
    position: sticky; top: 0; z-index: 50;
    display: flex; align-items: center; justify-content: space-between;
    padding: 16px 6vw; background: rgba(247,248,252,0.92);
    backdrop-filter: blur(8px); border-bottom: 1px solid var(--line);
  }
  .nav-logo { display: flex; align-items: center; gap: 10px; }
  .nav-logo img { width: 30px; height: 30px; }
  .nav-logo span { font-weight: 700; color: var(--navy-900); font-size: 15.5px; }

  .page-head { padding: 32px 6vw 8px; }
  .page-head h1 { font-family: var(--font-display); font-size: 26px; color: var(--navy-900); }

  .checkout-layout { display: grid; grid-template-columns: 1fr 340px; gap: 28px; padding: 20px 6vw 72px; align-items: start; }
  @media (max-width: 860px) { .checkout-layout { grid-template-columns: 1fr; } }

  .panel { background: var(--white); border: 1px solid var(--line); border-radius: 16px; padding: 24px; margin-bottom: 20px; }
  .panel h3 { font-family: var(--font-display); font-size: 17px; color: var(--navy-900); margin-bottom: 16px; }

  .field { margin-bottom: 16px; }
  .field label { display: block; font-size: 13px; font-weight: 600; margin-bottom: 6px; }
  .field input, .field textarea {
    width: 100%; padding: 11px 13px; border: 1px solid var(--line); border-radius: 9px;
    font-size: 14px; font-family: var(--font-body);
  }

  .delivery-options { display: flex; flex-direction: column; gap: 10px; }
  .delivery-option {
    display: flex; align-items: center; justify-content: space-between; gap: 12px;
    border: 1.5px solid var(--line); border-radius: 10px; padding: 14px 16px; cursor: pointer;
  }
  .delivery-option.selected { border-color: var(--navy-700); background: #f5f6ff; }
  .delivery-option .left { display: flex; align-items: center; gap: 12px; }
  .delivery-option input { accent-color: var(--navy-700); }
  .delivery-option .label { font-size: 14.5px; font-weight: 600; }
  .delivery-option .sub { font-size: 12.5px; color: var(--muted); }
  .delivery-option .fee { font-size: 14px; font-weight: 700; color: var(--navy-900); }

  .summary-panel { background: var(--white); border: 1px solid var(--line); border-radius: 16px; padding: 24px; position: sticky; top: 84px; }
  .summary-panel h3 { font-family: var(--font-display); font-size: 17px; color: var(--navy-900); margin-bottom: 18px; }
  .mini-item { display: flex; justify-content: space-between; font-size: 13.5px; margin-bottom: 10px; color: var(--ink); }
  .mini-item .name { color: var(--muted); }
  .summary-row { display: flex; justify-content: space-between; font-size: 14px; margin-bottom: 10px; color: var(--muted); }
  .summary-row.total { border-top: 1px solid var(--line); padding-top: 14px; margin-top: 10px; font-size: 17px; font-weight: 700; color: var(--navy-900); }
  .divider { border-top: 1px solid var(--line); margin: 14px 0; }

  .place-order-btn {
    width: 100%; padding: 14px 0; background: var(--orange-500); color: var(--white); border: none;
    border-radius: 10px; font-weight: 700; font-size: 15px; cursor: pointer; font-family: var(--font-body); margin-top: 6px;
  }
  .place-order-btn:hover { background: #e06f00; }
  .place-order-btn:disabled { background: #f3b877; cursor: not-allowed; }

  .error-banner { background: #fdecea; color: var(--danger); border: 1px solid #f5c6c2; border-radius: 10px; padding: 11px 14px; font-size: 13.5px; margin-bottom: 18px; display: none; }
  .error-banner.show { display: block; }

  .confirm-state { text-align: center; padding: 80px 20px; }
  .confirm-state .icon { font-size: 48px; margin-bottom: 18px; }
  .confirm-state h2 { font-family: var(--font-display); font-size: 26px; color: var(--navy-900); margin-bottom: 10px; }
  .confirm-state p { color: var(--muted); font-size: 15px; margin-bottom: 24px; }
  .confirm-state a { display: inline-block; background: var(--orange-500); color: var(--white); padding: 12px 24px; border-radius: 10px; font-weight: 700; }
</style>
</head>
<body>

<nav class="nav">
  <a class="nav-logo" href="/">
    <img src="/assets/images/jwings-logo.png" alt="JWings" />
    <span>JWings Logistics</span>
  </a>
</nav>

<div class="page-head">
  <h1>Checkout</h1>
</div>

<div id="pageContent">
  <div class="checkout-layout">
    <div>
      <div class="panel">
        <h3>Delivery address</h3>
        <div class="error-banner" id="errorBanner"></div>
        <div class="field">
          <label for="fullAddress">Full delivery address</label>
          <textarea id="fullAddress" rows="2" placeholder="Street, area, landmark..." required></textarea>
        </div>
        <div class="field">
          <label for="city">City</label>
          <input type="text" id="city" placeholder="e.g. Akure" required />
        </div>
        <div class="field">
          <label for="state">State</label>
          <input type="text" id="state" placeholder="e.g. Ondo" required />
        </div>
        <div class="field">
          <label for="orderNotes">Order notes (optional)</label>
          <textarea id="orderNotes" rows="2" placeholder="Any delivery instructions?"></textarea>
        </div>
      </div>

      <div class="panel">
        <h3>Delivery speed</h3>
        <div class="delivery-options" id="deliveryOptions">
          <label class="delivery-option selected" data-fee="1500">
            <span class="left"><input type="radio" name="deliveryType" value="standard" checked />
              <span><span class="label">Standard</span><br/><span class="sub">2–3 business days</span></span>
            </span>
            <span class="fee">₦1,500</span>
          </label>
          <label class="delivery-option" data-fee="2500">
            <span class="left"><input type="radio" name="deliveryType" value="express" />
              <span><span class="label">Express</span><br/><span class="sub">Next-day delivery</span></span>
            </span>
            <span class="fee">₦2,500</span>
          </label>
          <label class="delivery-option" data-fee="4000">
            <span class="left"><input type="radio" name="deliveryType" value="same_day" />
              <span><span class="label">Same-day</span><br/><span class="sub">Delivered today</span></span>
            </span>
            <span class="fee">₦4,000</span>
          </label>
        </div>
      </div>
    </div>

    <div class="summary-panel">
      <h3>Order Summary</h3>
      <div id="miniItems"></div>
      <div class="divider"></div>
      <div class="summary-row"><span>Subtotal</span><span id="sumSubtotal">₦0</span></div>
      <div class="summary-row"><span>Delivery fee</span><span id="sumDelivery">₦1,500</span></div>
      <div class="summary-row"><span>Service fee</span><span id="sumService">₦500</span></div>
      <div class="summary-row total"><span>Total</span><span id="sumTotal">₦0</span></div>
      <button class="place-order-btn" id="placeOrderBtn">Place order</button>
    </div>
  </div>
</div>

<script src="/shared/supabase-client.js"></script>
<script>
  const SERVICE_FEE = 500;
  let selectedFee = 1500;
  let selectedDeliveryType = "standard";

  const session = window.JWingsDB.getSession();
  if (!session) window.location.href = "/customer/login.html";

  function getCart() {
    try { return JSON.parse(localStorage.getItem("jwings_cart") || "[]"); }
    catch { return []; }
  }
  function money(amount, currency) {
    const symbol = currency === "NGN" ? "₦" : (currency || "");
    return `${symbol}${Number(amount).toLocaleString()}`;
  }

  const cart = getCart();
  if (cart.length === 0) {
    window.location.href = "/customer/cart.html";
  }

  function renderSummary() {
    const currency = cart[0].currency;
    const subtotal = cart.reduce((sum, i) => sum + i.price * i.quantity, 0);
    const total = subtotal + selectedFee + SERVICE_FEE;

    document.getElementById("miniItems").innerHTML = cart.map(i => `
      <div class="mini-item">
        <span class="name">${i.name} × ${i.quantity}</span>
        <span>${money(i.price * i.quantity, i.currency)}</span>
      </div>`).join("");

    document.getElementById("sumSubtotal").textContent = money(subtotal, currency);
    document.getElementById("sumDelivery").textContent = money(selectedFee, currency);
    document.getElementById("sumService").textContent = money(SERVICE_FEE, currency);
    document.getElementById("sumTotal").textContent = money(total, currency);
  }

  document.querySelectorAll(".delivery-option").forEach((el) => {
    el.addEventListener("click", () => {
      document.querySelectorAll(".delivery-option").forEach(o => o.classList.remove("selected"));
      el.classList.add("selected");
      el.querySelector("input").checked = true;
      selectedFee = parseInt(el.getAttribute("data-fee"), 10);
      selectedDeliveryType = el.querySelector("input").value;
      renderSummary();
    });
  });

  const errorBanner = document.getElementById("errorBanner");
  function showError(msg) { errorBanner.textContent = msg; errorBanner.classList.add("show"); }

  document.getElementById("placeOrderBtn").addEventListener("click", async () => {
    errorBanner.classList.remove("show");

    const fullAddress = document.getElementById("fullAddress").value.trim();
    const city = document.getElementById("city").value.trim();
    const state = document.getElementById("state").value.trim();
    const orderNotes = document.getElementById("orderNotes").value.trim();

    if (!fullAddress || !city || !state) {
      showError("Please fill in your full delivery address, city, and state.");
      return;
    }

    const btn = document.getElementById("placeOrderBtn");
    btn.disabled = true;
    btn.textContent = "Placing order...";

    try {
      const profile = await window.JWingsDB.getMyProfile(session.access_token);
      const currency = cart[0].currency;
      const subtotal = cart.reduce((sum, i) => sum + i.price * i.quantity, 0);
      const total = subtotal + selectedFee + SERVICE_FEE;
      const orderNumber = "JW" + Date.now().toString().slice(-8);

      // Save the delivery address for this order.
      const addresses = await window.JWingsDB.insert("addresses", {
        user_id: profile.id,
        label: "Delivery",
        full_address: fullAddress,
        city, state,
        is_default: false,
      }, session.access_token);
      const address = addresses[0];

      // Create the order.
      const orders = await window.JWingsDB.insert("orders", {
        order_number: orderNumber,
        customer_id: profile.id,
        delivery_address_id: address.id,
        buyer_currency: currency,
        fx_rate_to_buyer: 1,
        subtotal, delivery_fee: selectedFee, service_fee: SERVICE_FEE, total,
        delivery_type: selectedDeliveryType,
        order_notes: orderNotes || null,
        status: "new",
        payment_status: "unpaid",
      }, session.access_token);
      const order = orders[0];

      // Create one order_item per cart line.
      for (const item of cart) {
        await window.JWingsDB.insert("order_items", {
          order_id: order.id,
          vendor_id: item.vendor_id,
          product_id: item.product_id,
          product_name: item.name,
          quantity: item.quantity,
          unit_price: item.price,
          vendor_currency: item.currency,
          unit_price_buyer_currency: item.price,
          line_total_buyer_currency: item.price * item.quantity,
          vendor_order_status: "new",
        }, session.access_token);
      }

      // Create a trackable shipment for each vendor represented in this order
      // (most orders are single-vendor, but a cart can span more than one).
      const uniqueVendorIds = [...new Set(cart.map(i => i.vendor_id))];
      const vendors = await window.JWingsDB.select(
        "vendors", `select=id,store_name,city,state&id=in.(${uniqueVendorIds.join(",")})`, session.access_token
      );

      function generateTrackingId() {
        const rand = Math.random().toString(36).substring(2, 7).toUpperCase();
        return `JWT-${Date.now().toString().slice(-6)}${rand}`;
      }

      const trackingIds = [];
      for (const vendorId of uniqueVendorIds) {
        const vendor = vendors.find(v => v.id === vendorId);
        const trackingId = generateTrackingId();
        trackingIds.push(trackingId);

        await window.JWingsDB.insert("shipments", {
          tracking_id: trackingId,
          order_id: order.id,
          sender_id: profile.id,
          pickup_address: vendor ? `${vendor.store_name}, ${vendor.city || ""}${vendor.state ? ", " + vendor.state : ""}` : "Vendor location",
          dropoff_address: `${fullAddress}, ${city}, ${state}`,
          recipient_name: profile.full_name,
          recipient_phone: profile.phone || "",
          package_type: "parcel",
          package_weight_kg: 1,
          delivery_type: selectedDeliveryType,
          delivery_fee: selectedFee,
          currency: currency,
          payment_status: "unpaid",
          status: "order_received",
        }, session.access_token);
      }

      localStorage.removeItem("jwings_cart");

      document.getElementById("pageContent").innerHTML = `
        <div class="confirm-state">
          <div class="icon">🎉</div>
          <h2>Order placed!</h2>
          <p>Order <strong>${orderNumber}</strong> has been sent to the vendor.</p>
          <p style="font-size:13.5px; margin-top:-4px;">Tracking ID${trackingIds.length > 1 ? "s" : ""}: <strong>${trackingIds.join(", ")}</strong></p>
          <a href="/customer/order-detail.html?id=${order.id}" style="margin-right:10px;">Track this order</a>
          <a href="/customer/dashboard.html" style="background:transparent; color:#1a237e; border:1.5px solid #1a237e;">My dashboard</a>
        </div>`;
    } catch (err) {
      showError(err.message || "Something went wrong placing your order. Please try again.");
      btn.disabled = false;
      btn.textContent = "Place order";
    }
  });

  renderSummary();
</script>
</body>
</html>
